<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>체인렌즈 · 코인별 온체인 요약</title>

<!-- 차트 그리는 도구 (TradingView에서 무료로 공개한 라이브러리) -->
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

<style>
  /* ===== 색상표: 여기 값만 바꾸면 사이트 전체 색이 바뀌어요 ===== */
  :root {
    --bg: #ffffff;       /* 배경 */
    --soft: #f7f7f9;     /* 살짝 회색 배경 */
    --line: #ececf0;     /* 테두리 */
    --text: #17171c;     /* 글자 */
    --muted: #7a7a86;    /* 흐린 글자 */
    --brand: #5a48e0;    /* 강조색 (보라) */
    --up: #0fa86b;       /* 상승 (초록) */
    --down: #e5484d;     /* 하락 (빨강) */
    --warn: #e08a00;     /* 주의 (주황) */
    --price: #f2a93b;    /* 차트 가격선 */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; }
  .num { font-variant-numeric: tabular-nums; }

  /* ===== 맨 위 막대 ===== */
  header {
    display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 24px;
    border-bottom: 1px solid var(--line); background: var(--bg);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
  .brand span { color: var(--brand); }
  header .spacer { flex: 1; }
  #editToggle {
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  body.editing #editToggle { background: var(--brand); border-color: var(--brand); color: #fff; }

  /* ===== 코인 탭 ===== */
  .coins { display: flex; gap: 2px; overflow-x: auto; padding: 0 24px;
           border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .coins a {
    flex: none; display: flex; align-items: center; gap: 6px; padding: 12px 12px 10px;
    text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 600;
    border-bottom: 2px solid transparent;
  }
  .coins a.on { color: var(--text); border-bottom-color: var(--text); }
  .coins img, .coin-dot { width: 18px; height: 18px; border-radius: 50%; }

  main { max-width: 1240px; margin: 0 auto; padding: 28px 24px 40px; }

  /* ===== 편집 모드 안내 ===== */
  .editbar {
    display: none; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; line-height: 1.6;
    background: #f1effd; border: 1px solid #d9d3fb; border-radius: 10px; padding: 10px 14px; margin-bottom: 24px;
  }
  body.editing .editbar { display: flex; }
  .editbar p { margin: 0; flex: 1 1 320px; color: #4a4a57; }
  .btn { border: 1px solid var(--line); background: var(--bg); color: var(--text);
         padding: 6px 11px; border-radius: 7px; cursor: pointer; font-size: 13px; }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }

  /* ===== 코인 요약 (가격 + 통계) ===== */
  .hero { display: flex; flex-wrap: wrap; align-items: center; gap: 20px 0; margin-bottom: 44px; }
  .hero .id { display: flex; align-items: center; gap: 14px; padding-right: 28px; }
  .hero .id img, .hero .id .coin-dot { width: 52px; height: 52px; }
  .hero .nm { font-size: 17px; font-weight: 700; }
  .hero .nm small { color: var(--muted); font-weight: 500; margin-left: 4px; font-size: 14px; }
  .hero .px { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .hero .stat { border-left: 1px solid var(--line); padding: 2px 18px; }
  .hero .stat small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .hero .stat b { font-size: 14px; font-weight: 600; }
  .up { color: var(--up) !important; } .dn { color: var(--down) !important; }

  h2.title { font-size: 22px; margin: 0 0 18px; letter-spacing: -.02em; }

  /* ===== 주요 지표: 2열 표 ===== */
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 36px 40px; margin-bottom: 56px; }
  .panel h3 { font-size: 16px; margin: 0 0 12px; }
  .phead { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted);
           padding: 8px 0; border-bottom: 1px solid var(--line); }
  .prow {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer; width: 100%;
    background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; color: inherit;
  }
  .prow:hover .pname { color: var(--brand); }
  .prow .txt { min-width: 0; }
  .pname { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .pdesc { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { flex: none; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 6px; }
  .s-good { color: #0b7a4f; background: #e3f6ee; }
  .s-bad  { color: #c22f35; background: #fde8e9; }
  .s-warn { color: #a35f00; background: #fff1d9; }
  .s-mid  { color: #55555f; background: #eeeef2; }
  .edited { font-size: 11px; color: var(--brand); font-weight: 600; margin-left: 6px; }

  /* ===== 전체 지표 표 ===== */
  .sub { color: var(--muted); font-size: 13px; margin: -10px 0 16px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px;
            padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--soft); }
  .tbl td { padding: 14px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tr.click { cursor: pointer; }
  .tbl tr.click:hover td { background: var(--soft); }
  .tbl .rank { color: var(--muted); width: 36px; }
  .tbl .mname { font-weight: 600; white-space: nowrap; }
  .tbl .mdesc { color: var(--muted); max-width: 440px; line-height: 1.5; }
  .tbl .r { text-align: right; white-space: nowrap; }
  .tbl svg { width: 120px; height: 34px; display: block; margin-left: auto; }
  .memo { display: block; color: var(--brand); font-size: 12px; font-weight: 500; margin-top: 3px; white-space: pre-wrap; }

  .loading { color: var(--muted); padding: 80px 0; text-align: center; }

  /* ===== 상세 차트 창 ===== */
  dialog {
    width: min(1000px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
    background: var(--bg); color: var(--text); border: 0; border-radius: 14px; padding: 20px 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,.18);
  }
  dialog::backdrop { background: rgba(20,20,30,.45); }
  .dhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .dhead small { color: var(--muted); }
  .dhead h3 { margin: 2px 0 0; font-size: 20px; }
  #dClose { background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }
  .desc { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 8px 0 14px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .seg { display: flex; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .seg button { border: 0; background: none; color: var(--muted); padding: 5px 11px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .seg button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  label.chk { font-size: 13px; color: var(--muted); display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .chartbox { position: relative; height: 380px; border: 1px solid var(--line); border-radius: 10px; }
  #chart { position: absolute; inset: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 3px; vertical-align: middle; margin-right: 5px; }

  /* ===== 상세 창 안의 편집 영역 ===== */
  #editArea { display: none; margin-top: 18px; border-top: 1px solid var(--line); padding-top: 16px; }
  body.editing #editArea { display: block; }
  #editArea h4 { margin: 0 0 8px; font-size: 14px; color: var(--brand); }
  #editArea .hint { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
  .addrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  input, textarea { background: var(--bg); color: var(--text); border: 1px solid #d8d8e0;
                    border-radius: 7px; padding: 6px 9px; font: inherit; font-size: 13px; }
  input:focus, textarea:focus { outline: none; border-color: var(--brand); }
  .tablewrap { max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
  .etbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .etbl th, .etbl td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; }
  .etbl th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--soft); }
  .etbl td input { width: 100%; min-width: 110px; }
  .etbl tr.changed td { background: #f1effd; }
  textarea { width: 100%; min-height: 60px; resize: vertical; }

  footer { color: var(--muted); font-size: 12px; line-height: 1.7; border-top: 1px solid var(--line);
           padding: 18px 24px 30px; max-width: 1240px; margin: 0 auto; }
  footer a { color: var(--muted); }

  /* ===== 휴대폰 화면 ===== */
  @media (max-width: 860px) {
    .panels { grid-template-columns: 1fr; }
    .tbl .mdesc, .tbl .col-desc { display: none; }
  }
  @media (max-width: 640px) {
    header, .coins { padding-left: 16px; padding-right: 16px; }
    main { padding: 20px 16px 32px; }
    .hero { gap: 14px 0; }
    .hero .id { width: 100%; }
    .hero .stat { flex: 1 1 33%; padding: 2px 10px; }
    .hero .stat:nth-of-type(4) { border-left: 0; padding-left: 0; }
    .tbl svg { width: 70px; }
    .tbl .col-spark, .tbl td.spark { display: none; }
    dialog { width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; padding: 14px 16px; }
    .chartbox { height: 300px; }
    footer { padding: 18px 16px 30px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">Chain<span>Lens</span></div>
  <span class="spacer"></span>
  <button id="editToggle">✎ 데이터 편집</button>
</header>

<nav class="coins" id="coins"></nav>

<main>
  <div class="editbar">
    <p>
      <b>편집 모드</b> · 지표를 눌러 값을 고치거나 메모를 남겨 보세요. 고친 내용은 이 브라우저에 바로 저장돼요.
      다른 기기에서도 보려면 <b>파일로 내보내기</b> → 받은 <b>overrides.json</b>을 GitHub 저장소에 올리세요.
      <span id="editCount"></span>
    </p>
    <button class="btn primary" id="exportBtn">파일로 내보내기</button>
    <button class="btn" id="importBtn">파일 불러오기</button>
    <button class="btn" id="resetBtn">게시된 버전으로 되돌리기</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>

  <div id="page"><div class="loading">데이터 불러오는 중…</div></div>
</main>

<footer>
  온체인 데이터: <a href="https://coinmetrics.io/community-network-data/" target="_blank" rel="noopener">Coin Metrics Community Data</a> (CC BY-NC 4.0) ·
  시세: <a href="https://www.coingecko.com/" target="_blank" rel="noopener">CoinGecko</a> ·
  상태 표시는 단순한 기준으로 자동 계산한 값이며 투자 조언이 아닙니다.
</footer>

<!-- 지표를 누르면 열리는 상세 창 -->
<dialog id="dlg">
  <div class="dhead">
    <div><small id="dCoin"></small><h3 id="dTitle"></h3></div>
    <button id="dClose" aria-label="닫기">✕</button>
  </div>
  <p class="desc" id="dDesc"></p>
  <div class="toolbar">
    <div class="seg" id="range">
      <button data-days="90">3개월</button>
      <button data-days="365" class="on">1년</button>
      <button data-days="1095">3년</button>
      <button data-days="0">전체</button>
    </div>
    <label class="chk"><input type="checkbox" id="showPrice" checked> 가격 겹쳐 보기</label>
    <label class="chk"><input type="checkbox" id="logScale"> 로그 스케일</label>
  </div>
  <div class="chartbox"><div id="chart"></div></div>
  <div class="legend">
    <span><i style="background:var(--brand)"></i><span id="lgName"></span></span>
    <span id="lgPrice"><i style="background:var(--price)"></i>가격 (USD)</span>
    <span id="lgEdit"><i style="background:var(--down);height:8px;width:8px;border-radius:50%"></i>직접 수정한 날짜</span>
  </div>
  <div id="editArea"></div>
</dialog>

<script>
/* =====================================================================
   1) 코인 목록
   - cg: CoinGecko 이름 (시세·아이콘용)
   - extra: 그 코인에서만 받을 수 있는 추가 온체인 지표
   ===================================================================== */
const COINS = [
  { id: 'btc',  cg: 'bitcoin',      name: '비트코인',     sym: 'BTC',  extra: ['FeeTotNtv', 'HashRate', 'IssTotUSD', 'FlowInExUSD', 'FlowOutExUSD', 'SplyExNtv'] },
  { id: 'eth',  cg: 'ethereum',     name: '이더리움',     sym: 'ETH',  extra: ['FeeTotNtv', 'IssTotUSD', 'FlowInExUSD', 'FlowOutExUSD', 'SplyExNtv'] },
  { id: 'xrp',  cg: 'ripple',       name: '리플',         sym: 'XRP',  extra: ['FeeTotNtv'] },
  { id: 'usdt', cg: 'tether',       name: '테더',         sym: 'USDT', extra: [] },
  { id: 'doge', cg: 'dogecoin',     name: '도지코인',     sym: 'DOGE', extra: ['FeeTotNtv', 'HashRate', 'IssTotUSD'] },
  { id: 'ada',  cg: 'cardano',      name: '에이다',       sym: 'ADA',  extra: ['FeeTotNtv', 'IssTotUSD'] },
  { id: 'link', cg: 'chainlink',    name: '체인링크',     sym: 'LINK', extra: ['IssTotUSD'] },
  { id: 'ltc',  cg: 'litecoin',     name: '라이트코인',   sym: 'LTC',  extra: ['FeeTotNtv', 'HashRate', 'IssTotUSD'] },
  { id: 'bch',  cg: 'bitcoin-cash', name: '비트코인캐시', sym: 'BCH',  extra: ['FeeTotNtv', 'HashRate', 'IssTotUSD'] },
];
const COMMON = ['PriceUSD', 'CapMrktCurUSD', 'CapMVRVCur', 'AdrActCnt', 'TxCnt', 'AdrBalCnt', 'SplyCur', 'ROI30d'];

/* =====================================================================
   2) 지표 묶음과 설명
   - fmt: 숫자 표시 방법 (usd 달러, num 개수, ratio 비율, pct 퍼센트, hash 해시, coin 코인 수)
   - needs + calc: 다른 지표 두 개로 계산하는 지표
   ===================================================================== */
const SECTIONS = [
  { id: 'flow',     name: '거래소 흐름' },
  { id: 'value',    name: '가치평가' },
  { id: 'activity', name: '네트워크 활동' },
  { id: 'supply',   name: '채굴 · 공급' },
];

const METRICS = [
  { key: 'NetflowUSD', sec: 'flow', name: '거래소 순유입 (Netflow)', fmt: 'usd', kind: 'hist',
    needs: ['FlowInExUSD', 'FlowOutExUSD'], calc: (a, b) => a - b,
    short: '거래소로 들어온 금액에서 나간 금액을 뺀 값',
    desc: '거래소로 들어온 금액 − 거래소에서 나간 금액이에요. 플러스(+)가 크면 팔려고 거래소로 옮기는 코인이 많다는 뜻이라 매도 압력으로, 마이너스(−)면 개인 지갑으로 옮겨 보관하는 흐름으로 해석해요. 상태는 최근 7일 합계로 판단해요.' },
  { key: 'FlowInExUSD', sec: 'flow', name: '거래소 유입량 (Inflow)', fmt: 'usd',
    short: '하루 동안 거래소 지갑으로 들어온 코인 가치',
    desc: '하루 동안 거래소 지갑으로 들어온 코인의 달러 가치예요. 갑자기 크게 늘면 큰손이 팔 준비를 하는 신호일 수 있어요.' },
  { key: 'FlowOutExUSD', sec: 'flow', name: '거래소 유출량 (Outflow)', fmt: 'usd',
    short: '하루 동안 거래소에서 빠져나간 코인 가치',
    desc: '하루 동안 거래소에서 빠져나간 코인의 달러 가치예요. 늘어나면 사서 개인 지갑에 보관하려는 사람이 많다는 뜻으로 봐요.' },
  { key: 'SplyExNtv', sec: 'flow', name: '거래소 보유량 (Reserve)', fmt: 'coin',
    short: '모든 거래소 지갑에 쌓여 있는 코인 수',
    desc: '모든 거래소 지갑에 쌓여 있는 코인 수예요. 줄어들면 장기 보유 성향이, 늘어나면 팔 수 있는 물량이 늘어난 것으로 해석해요. 상태는 30일 전과 비교해요.' },

  { key: 'CapMVRVCur', sec: 'value', name: 'MVRV 비율', fmt: 'ratio',
    short: '시가총액 ÷ 실현 시가총액 — 고평가·저평가 판단',
    desc: '시가총액 ÷ 실현 시가총액(각 코인이 마지막으로 옮겨졌을 때 가격으로 계산한 가치)이에요. 1보다 낮으면 보유자들이 평균적으로 손실 중이라 저평가로, 3.5보다 높으면 과열로 자주 해석해요.' },
  { key: 'PriceUSD', sec: 'value', name: '가격', fmt: 'usd',
    short: '여러 거래소 가격을 모은 기준 가격',
    desc: '여러 거래소 가격을 모아 계산한 하루 기준 가격(달러)이에요.' },
  { key: 'CapMrktCurUSD', sec: 'value', name: '시가총액', fmt: 'usd',
    short: '가격 × 유통량',
    desc: '가격 × 유통량. 이 코인 전체의 "몸값"이에요.' },
  { key: 'ROI30d', sec: 'value', name: '30일 수익률', fmt: 'pct',
    short: '30일 전에 샀다면 지금 수익률',
    desc: '30일 전에 샀다면 지금 몇 % 수익(또는 손실)인지 보여줘요.' },

  { key: 'AdrActCnt', sec: 'activity', name: '활성 주소 수', fmt: 'num',
    short: '하루 동안 거래에 참여한 고유 주소 수',
    desc: '하루 동안 거래에 참여한 고유 주소 수예요. 사용자 활동의 크기를 대략 보여줘요. 상태는 최근 7일 평균을 90일 평균과 비교해요.' },
  { key: 'TxCnt', sec: 'activity', name: '일일 거래 수', fmt: 'num',
    short: '하루 동안 블록체인에 기록된 거래 개수',

    short: '잔고가 0보다 많은 주소 수',
    desc: '잔고가 0보다 많은 주소 수예요. 꾸준히 늘면 보유자층이 넓어지고 있다는 뜻이에요.' },
  { key: 'FeeTotUSD', sec: 'activity', name: '거래 수수료 합계', fmt: 'usd',
    needs: ['FeeTotNtv', 'PriceUSD'], calc: (a, b) => a * b,
    short: '하루 동안 사용자들이 낸 수수료 총액',

  { key: 'SplyCur', sec: 'supply', name: '유통량', fmt: 'coin',

/* =====================================================================
   3) 데이터 가져오기
   - 온체인: Coin Metrics 무료 API
   - 시세·거래량·아이콘: CoinGecko 무료 API
   ===================================================================== */
const API = 'https://community-api.coinmetrics.io/v4/timeseries/asset-metrics';
const raw = {};       // raw.btc.PriceUSD = Map('2026-10-11' → 값)
let MARKET = {};      // MARKET.bitcoin = { current_price, image, ... }
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function loadMarket() {
  try {
    const ids = COINS.map(c => c.cg).join(',');
    const r = await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${ids}&price_change_percentage=24h,7d`);
    const list = await r.json();
    for (const m of list) MARKET[m.id] = m;
  } catch {}   // 실패해도 온체인 데이터로 대신 보여줘요
}

async function getRows(id, metrics, tries = 0) {
  const url = `${API}?assets=${id}&metrics=${metrics.join(',')}&frequency=1d&page_size=10000&paging_from=end`;
  const res = await fetch(url);
  if (res.status === 429 && tries < 4) {          // 요청이 너무 많으면 잠깐 쉬었다가 다시
    await sleep(2000 * (tries + 1));
    return getRows(id, metrics, tries + 1);
  }
  const json = await res.json();
  if (json.error) throw new Error(json.error.message);
  return json.data;
}

async function fetchCoin(c) {
  if (raw[c.id]) return raw[c.id];
  const metrics = [...COMMON, ...c.extra];
  let rows;
  try {
    rows = await getRows(c.id, metrics);
  } catch (e) {
    rows = [];
    for (const m of metrics) { try { rows.push(...await getRows(c.id, [m])); } catch {} }
  }
  const out = {};
  for (const m of metrics) out[m] = new Map();
  for (const r of rows) {
    const day = r.time.slice(0, 10);
    for (const m of metrics) if (r[m] != null && r[m] !== '') out[m].set(day, parseFloat(r[m]));
  }
  return (raw[c.id] = out);
}

/* =====================================================================
   4) 내가 고친 값 (overrides)
   - { values: { btc: { PriceUSD: { '2026-10-11': 82000 } } }, notes: { btc: { CapMVRVCur: '메모' } } }
   - 이 브라우저에 저장된 것이 있으면 그걸, 없으면 GitHub에 올린 overrides.json을 써요
   ===================================================================== */
const LS_KEY = 'chainlens-overrides';
let PUBLISHED = { values: {}, notes: {} };
let OV = { values: {}, notes: {} };
const tidy = o => ({ values: (o && o.values) || {}, notes: (o && o.notes) || {} });

async function loadOverrides() {
  try {
    const r = await fetch('overrides.json', { cache: 'no-store' });
    if (r.ok) PUBLISHED = tidy(await r.json());
  } catch {}
  let local = null;
  try { local = JSON.parse(localStorage.getItem(LS_KEY)); } catch {}
  OV = tidy(local || JSON.parse(JSON.stringify(PUBLISHED)));
}
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(OV)); } catch {}
  updateEditCount();
}
function setValue(coinId, key, day, value) {
  const byCoin = (OV.values[coinId] ??= {});
  const byKey = (byCoin[key] ??= {});
  if (value === '' || value == null || !isFinite(value)) delete byKey[day];
  else byKey[day] = Number(value);
  if (!Object.keys(byKey).length) delete byCoin[key];
  if (!Object.keys(byCoin).length) delete OV.values[coinId];
  saveLocal();
}
function setNote(coinId, key, text) {
  const byCoin = (OV.notes[coinId] ??= {});
  if (text.trim()) byCoin[key] = text; else delete byCoin[key];
  if (!Object.keys(byCoin).length) delete OV.notes[coinId];
  saveLocal();
}
const editsOf = (coinId, key) => (OV.values[coinId] && OV.values[coinId][key]) || {};
const noteOf  = (coinId, key) => (OV.notes[coinId] && OV.notes[coinId][key]) || '';
function editedDays(coinId, def) {
  const keys = def.needs || [def.key];
  return [...new Set(keys.flatMap(k => Object.keys(editsOf(coinId, k))))].sort();
}
function updateEditCount() {
  let n = 0, m = 0;
  for (const c of Object.values(OV.values)) for (const k of Object.values(c)) n += Object.keys(k).length;
  for (const c of Object.values(OV.notes)) m += Object.keys(c).length;
  document.getElementById('editCount').textContent = `(지금 고친 값 ${n}개 · 메모 ${m}개)`;
}

/* =====================================================================
   5) 지표 데이터 만들기 (원본 + 내가 고친 값 합치기)
   ===================================================================== */
function baseMap(coinId, key) {
  const m = new Map((raw[coinId] && raw[coinId][key]) || []);
  for (const [day, v] of Object.entries(editsOf(coinId, key))) m.set(day, v);
  return m;
}
function seriesMap(coinId, def) {
  if (!def.calc) return baseMap(coinId, def.key);
  const [a, b] = def.needs.map(k => baseMap(coinId, k));
  const out = new Map();
  for (const [day, va] of a) { const vb = b.get(day); if (vb != null) out.set(day, def.calc(va, vb)); }
  return out;
}
const toArr = map => [...map].sort((x, y) => (x[0] < y[0] ? -1 : 1)).map(([time, value]) => ({ time, value }));

/* =====================================================================
   6) 숫자 보기 좋게 바꾸기
   ===================================================================== */
function short(v) {
  const a = Math.abs(v);
  if (a >= 1e12) return (v / 1e12).toFixed(2) + 'T';
  if (a >= 1e9)  return (v / 1e9).toFixed(2) + 'B';
  if (a >= 1e6)  return (v / 1e6).toFixed(2) + 'M';
  if (a >= 1000) return Math.round(v).toLocaleString('en-US');
  if (a >= 1)    return v.toFixed(2);
  if (a === 0)   return '0';
  return Number(v.toPrecision(3)).toString();
}
function hash(th) {   // 원본 단위: TH/s
  for (const [u, f] of [['EH/s', 1e6], ['PH/s', 1e3], ['TH/s', 1], ['GH/s', 1e-3]])
    if (th >= f) return (th / f).toFixed(2) + ' ' + u;
  return (th * 1e6).toFixed(2) + ' MH/s';
}
function fmt(v, def, c) {
  if (v == null || !isFinite(v)) return '–';
  switch (def.fmt) {
    case 'usd':   return (v < 0 ? '-$' : '$') + short(Math.abs(v));
    case 'ratio': return v.toFixed(4);
    case 'pct':   return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
    case 'hash':  return hash(v);
    case 'coin':  return short(v) + ' ' + c.sym;
    default:      return short(v);
  }
}
const fullUsd = v => v == null ? '–' : '$' + (v >= 1 ? v.toLocaleString('en-US', { maximumFractionDigits: 2 }) : Number(v.toPrecision(4)));
const pctTxt = v => v == null || !isFinite(v) ? '–' : (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
const pctCls = v => v == null || !isFinite(v) ? '' : v >= 0 ? 'up' : 'dn';
const rawUnit = (def, c) => ({ usd: 'USD', ratio: '배', pct: '%', hash: 'TH/s', coin: c.sym })[def.fmt] || '개';
const avg = a => a.reduce((s, x) => s + x.value, 0) / (a.length || 1);

/* =====================================================================
   7) 상태 표시 — 단순한 기준으로 자동 계산
   ===================================================================== */
function status(def, arr) {
  if (arr.length < 31) return { t: 'N/A', c: 'mid' };
  const last = arr[arr.length - 1].value;
  const vs90 = avg(arr.slice(-7)) / avg(arr.slice(-90)) - 1;
  switch (def.key) {
    case 'CapMVRVCur':
      return last < 1 ? { t: 'Undervalued', c: 'good' } : last > 3.5 ? { t: 'Overheated', c: 'bad' }
           : last > 2.4 ? { t: 'Caution', c: 'warn' } : { t: 'Neutral', c: 'mid' };
    case 'NetflowUSD':
      return arr.slice(-7).reduce((x, p) => x + p.value, 0) > 0 ? { t: 'Bearish', c: 'bad' } : { t: 'Bullish', c: 'good' };
    case 'FlowInExUSD':
      return vs90 > 0.15 ? { t: 'High Inflow', c: 'bad' } : { t: 'Normal', c: 'mid' };
    case 'FlowOutExUSD':
      return vs90 > 0.15 ? { t: 'High Outflow', c: 'good' } : { t: 'Normal', c: 'mid' };
    case 'SplyExNtv':
      return last < arr[arr.length - 31].value ? { t: 'Bullish', c: 'good' } : { t: 'Bearish', c: 'bad' };
    case 'ROI30d':
      return last > 30 ? { t: 'Overheated', c: 'warn' } : last < -20 ? { t: 'Oversold', c: 'good' } : { t: 'Neutral', c: 'mid' };
    case 'HashRate':
      return vs90 > 0.03 ? { t: 'Rising', c: 'good' } : vs90 < -0.03 ? { t: 'Falling', c: 'bad' } : { t: 'Stable', c: 'mid' };
    case 'AdrActCnt': case 'TxCnt': case 'FeeTotUSD':
      return vs90 > 0.05 ? { t: 'Active', c: 'good' } : vs90 < -0.05 ? { t: 'Quiet', c: 'bad' } : { t: 'Normal', c: 'mid' };
    default:
      return vs90 > 0.05 ? { t: 'Rising', c: 'good' } : vs90 < -0.05 ? { t: 'Falling', c: 'bad' } : { t: 'Neutral', c: 'mid' };
  }
}

/* 표 속 작은 그래프 (최근 7일) */
function sparkline(arr) {
  const pts = arr.slice(-7);
  if (pts.length < 2) return '';
  const W = 120, H = 34, vals = pts.map(p => p.value);
  const min = Math.min(...vals), max = Math.max(...vals);
  const y = v => H - 3 - (v - min) / ((max - min) || 1) * (H - 6);
  const d = pts.map((p, i) => `${(i / (pts.length - 1) * W).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  const color = vals[vals.length - 1] >= vals[0] ? 'var(--up)' : 'var(--down)';
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${d}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

/* =====================================================================
   8) 페이지 그리기
   ===================================================================== */
const $ = id => document.getElementById(id);
const currentCoin = () => COINS.find(c => c.id === location.hash.slice(1)) || COINS[0];
const icon = (c, cls = '') => MARKET[c.cg] && MARKET[c.cg].image
  ? `<img src="${MARKET[c.cg].image}" alt="" class="${cls}">`
  : `<span class="coin-dot ${cls}" style="background:var(--soft);display:inline-block"></span>`;

function drawTabs() {
  const c = currentCoin();
  $('coins').innerHTML = COINS.map(x =>
    `<a href="#${x.id}" class="${x === c ? 'on' : ''}">${icon(x)}${x.sym}</a>`).join('');
}

async function renderCoin() {
  const c = currentCoin();
  drawTabs();
  document.title = `${c.name}: 온체인 요약 | ChainLens`;
  if (!raw[c.id]) $('page').innerHTML = `<div class="loading">${c.name} 데이터 불러오는 중…</div>`;
  try {
    await fetchCoin(c);
  } catch (e) {
    $('page').innerHTML = `<div class="loading">데이터를 불러오지 못했어요. 잠시 후 새로고침해 주세요.<br>${e.message}</div>`;
    return;
  }
  if (c !== currentCoin()) return;
  drawPage(c);
}

function drawPage(c) {
  const get = key => toArr(seriesMap(c.id, METRICS.find(m => m.key === key)));
  const price = get('PriceUSD'), cap = get('CapMrktCurUSD'), sply = get('SplyCur');
  const last = a => a.length ? a[a.length - 1].value : null;
  const back = (a, n) => a.length > n ? a[a.length - 1 - n].value : null;
  const m = MARKET[c.cg] || {};

  // 맨 위 요약: 시세는 CoinGecko 실시간, 없으면 온체인 데이터로 대신
  const px    = m.current_price ?? last(price);
  const ch24  = m.price_change_percentage_24h_in_currency ?? (last(price) / back(price, 1) - 1) * 100;
  const ch7   = m.price_change_percentage_7d_in_currency ?? (last(price) / back(price, 7) - 1) * 100;
  const mcap  = m.market_cap ?? last(cap);
  const vol   = m.total_volume;
  const supply = m.circulating_supply ?? last(sply);

  let html = `
    <div class="hero">
      <div class="id">
        ${icon(c)}
        <div>
          <div class="nm">${c.name}<small>${c.sym}</small></div>
          <div class="px num">${fullUsd(px)}</div>
        </div>
      </div>
      <div class="stat"><small>24시 %</small><b class="num ${pctCls(ch24)}">${pctTxt(ch24)}</b></div>
      <div class="stat"><small>7일 %</small><b class="num ${pctCls(ch7)}">${pctTxt(ch7)}</b></div>
      <div class="stat"><small>시가총액</small><b class="num">${mcap ? '$' + Math.round(mcap).toLocaleString('en-US') : '–'}</b></div>
      <div class="stat"><small>거래량(24시)</small><b class="num">${vol ? '$' + Math.round(vol).toLocaleString('en-US') : '–'}</b></div>
      <div class="stat"><small>유통 공급량</small><b class="num">${supply ? Math.round(supply).toLocaleString('en-US') + ' ' + c.sym : '–'}</b></div>
    </div>

    <h2 class="title">주요 지표</h2>
    <div class="panels">`;

  // 주요 지표: 묶음별 표 (지표 이름 + 한 줄 설명 + 상태)
  const rowsAll = [];
  for (const s of SECTIONS) {
    const rows = METRICS.filter(d => d.sec === s.id).map(def => {
      const arr = toArr(seriesMap(c.id, def));
      if (!arr.length) return '';
      rowsAll.push({ def, arr });
      const st = status(def, arr);
      return `
        <button class="prow" data-key="${def.key}">
          <div class="txt">
            <div class="pname">${def.name}${editedDays(c.id, def).length ? '<span class="edited">✎ 수정됨</span>' : ''}</div>
            <div class="pdesc">${def.short}</div>
          </div>
          <span class="pill s-${st.c}">${st.t}</span>
        </button>`;
    }).join('');
    if (rows.trim()) html += `
      <div class="panel">
        <h3>${s.name}</h3>
        <div class="phead"><span>지표</span><span>상태(24시)</span></div>
        ${rows}
      </div>`;
  }
  html += `</div>`;

  // 전체 지표 표
  html += `
    <h2 class="title">전체 온체인 지표</h2>
    <p class="sub">${c.name}에서 볼 수 있는 모든 지표의 최신 값이에요. 기준일 ${price.length ? price[price.length - 1].time : '–'} (UTC)</p>
    <table class="tbl">
      <thead><tr>
        <th>#</th><th>지표</th><th class="col-desc">설명</th>
        <th class="r">최신 값</th><th class="r">24H (%)</th><th class="r col-spark">최근 7일</th>
      </tr></thead>
      <tbody>${rowsAll.map(({ def, arr }, i) => {
        const v = arr[arr.length - 1].value, p = arr.length > 1 ? arr[arr.length - 2].value : null;
        const chg = p ? (v - p) / Math.abs(p) * 100 : null;
        const memo = noteOf(c.id, def.key);
        return `
        <tr class="click" data-key="${def.key}">
          <td class="rank">${i + 1}</td>
          <td class="mname">${def.name}${memo ? `<span class="memo" data-memo="${def.key}"></span>` : ''}</td>
          <td class="mdesc">${def.desc}</td>
          <td class="r num">${fmt(v, def, c)}</td>
          <td class="r num ${pctCls(chg)}">${pctTxt(chg)}</td>
          <td class="r spark">${sparkline(arr)}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;

  $('page').innerHTML = html;
  // 메모는 사용자가 쓴 글이라 안전하게 글자로만 넣기
  document.querySelectorAll('[data-memo]').forEach(el => el.textContent = '메모: ' + noteOf(c.id, el.dataset.memo));
  document.querySelectorAll('[data-key]').forEach(el => el.onclick = () => openDetail(el.dataset.key));
}

/* =====================================================================
   9) 상세 차트 창
   ===================================================================== */
let chart, mainSeries, priceSeries, curDef, days = 365;
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function ensureChart() {
  if (chart) return;
  chart = LightweightCharts.createChart($('chart'), {
    autoSize: true,
    layout: { background: { color: 'transparent' }, textColor: cssVar('--muted'), fontSize: 12 },
    grid: { vertLines: { color: cssVar('--line') }, horzLines: { color: cssVar('--line') } },
    rightPriceScale: { borderColor: cssVar('--line') },
    leftPriceScale: { borderColor: cssVar('--line') },
    timeScale: { borderColor: cssVar('--line') },
  });
}

function openDetail(key) {
  curDef = METRICS.find(m => m.key === key);
  $('dlg').showModal();
  ensureChart();
  drawDetail();
  drawEditArea();
}

function drawDetail() {
  const c = currentCoin(), def = curDef;
  $('dCoin').textContent = `${c.name} · ${c.sym}`;
  $('dTitle').textContent = def.name;
  $('dDesc').textContent = def.desc;
  $('lgName').textContent = def.name;

  const all = toArr(seriesMap(c.id, def));
  const data = days ? all.slice(-days) : all;
  const fmtFn = v => fmt(v, def, c);

  if (mainSeries) chart.removeSeries(mainSeries);
  if (priceSeries) { chart.removeSeries(priceSeries); priceSeries = null; }

  if (def.kind === 'hist') {
    mainSeries = chart.addHistogramSeries({ priceScaleId: 'right', priceFormat: { type: 'custom', formatter: fmtFn } });
    mainSeries.setData(data.map(p => ({ ...p, color: p.value >= 0 ? cssVar('--down') : cssVar('--up') })));
  } else {
    mainSeries = chart.addAreaSeries({
      priceScaleId: 'right', lineColor: cssVar('--brand'), lineWidth: 2,
      topColor: 'rgba(90,72,224,.25)', bottomColor: 'rgba(90,72,224,0)',
      priceFormat: { type: 'custom', formatter: fmtFn },
    });
    mainSeries.setData(data);
  }

  // 직접 고친 날짜에 빨간 점 찍기
  const from = data.length ? data[0].time : '';
  const marks = editedDays(c.id, def).filter(d => d >= from)
    .map(time => ({ time, position: 'inBar', color: cssVar('--down'), shape: 'circle' }));
  mainSeries.setMarkers(marks);
  $('lgEdit').style.display = marks.length ? '' : 'none';

  // 가격 겹쳐 보기
  const showPrice = $('showPrice').checked && def.key !== 'PriceUSD';
  if (showPrice) {
    priceSeries = chart.addLineSeries({
      priceScaleId: 'left', color: cssVar('--price'), lineWidth: 1.5,
      priceFormat: { type: 'custom', formatter: v => fmt(v, { fmt: 'usd' }, c) },
    });
    priceSeries.setData(toArr(baseMap(c.id, 'PriceUSD')).filter(p => p.time >= from));
  }
  const mode = $('logScale').checked && def.kind !== 'hist' ? 1 : 0;
  chart.applyOptions({ leftPriceScale: { visible: showPrice, mode }, rightPriceScale: { mode } });
  $('lgPrice').style.display = showPrice ? '' : 'none';
  chart.timeScale().fitContent();
}

/* ----- 편집 영역 (편집 모드일 때만 보여요) ----- */
function drawEditArea() {
  const c = currentCoin(), def = curDef, box = $('editArea');
  let html = `<h4>✎ 이 지표 수정하기</h4>`;

  if (def.calc) {
    const names = def.needs.map(k => (METRICS.find(m => m.key === k) || { name: k }).name).join(', ');
    html += `<p class="hint">이 지표는 자동으로 계산돼요 (${names}). 그 지표들을 고치면 여기도 함께 바뀌어요.</p>`;
  } else {
    const orig = (raw[c.id] && raw[c.id][def.key]) || new Map();
    const merged = toArr(baseMap(c.id, def.key));
    const lastDay = merged.length ? merged[merged.length - 1].time : new Date().toISOString().slice(0, 10);
    const mine = editsOf(c.id, def.key);
    const rows = [...new Set([...merged.slice(-30).map(p => p.time), ...Object.keys(mine)])].sort().reverse();
    html += `
      <p class="hint">숫자는 원본 단위(${rawUnit(def, c)})로 넣어 주세요. 칸을 비우면 원래 값으로 돌아가요. 새 날짜를 넣으면 데이터가 추가돼요.</p>
      <div class="addrow">
        <input type="date" id="addDay" value="${lastDay}">
        <input type="number" step="any" id="addVal" placeholder="값 (${rawUnit(def, c)})">
        <button class="btn primary" id="addBtn">이 날짜에 저장</button>
      </div>
      <div class="tablewrap"><table class="etbl">
        <thead><tr><th>날짜</th><th>원본 값</th><th>내가 고친 값</th><th></th></tr></thead>
        <tbody>${rows.map(d => `
          <tr class="${d in mine ? 'changed' : ''}">
            <td>${d}</td>
            <td>${orig.has(d) ? fmt(orig.get(d), def, c) : '<span style="color:var(--muted)">없음</span>'}</td>
            <td><input type="number" step="any" data-day="${d}" value="${d in mine ? mine[d] : ''}" placeholder="${orig.has(d) ? orig.get(d) : ''}"></td>
            <td>${d in mine ? `<button class="btn" data-undo="${d}">되돌리기</button>` : ''}</td>
          </tr>`).join('')}
        </tbody></table></div>`;
  }
  html += `<p class="hint" style="margin-top:14px">표에 보일 메모</p>
    <textarea id="memo" placeholder="예: 10월 둘째 주 대규모 유출 — 기관 매수 추정"></textarea>`;
  box.innerHTML = html;
  $('memo').value = noteOf(c.id, def.key);

  const refresh = () => { drawDetail(); drawEditArea(); drawPage(c); };
  if (!def.calc) {
    $('addBtn').onclick = () => {
      const d = $('addDay').value, v = $('addVal').value;
      if (!d || v === '') return alert('날짜와 값을 모두 넣어 주세요.');
      setValue(c.id, def.key, d, parseFloat(v)); refresh();
    };
    box.querySelectorAll('input[data-day]').forEach(inp => inp.onchange = () => {
      setValue(c.id, def.key, inp.dataset.day, inp.value === '' ? '' : parseFloat(inp.value)); refresh();
    });
    box.querySelectorAll('[data-undo]').forEach(b => b.onclick = () => {
      setValue(c.id, def.key, b.dataset.undo, ''); refresh();
    });
  }
  $('memo').onchange = () => { setNote(c.id, def.key, $('memo').value); drawPage(c); };
}

/* =====================================================================
   10) 버튼 연결
   ===================================================================== */
$('dClose').onclick = () => $('dlg').close();
$('dlg').addEventListener('click', e => { if (e.target === $('dlg')) $('dlg').close(); });
$('range').onclick = e => {
  if (!e.target.dataset.days) return;
  days = Number(e.target.dataset.days);
  [...$('range').children].forEach(b => b.classList.toggle('on', b === e.target));
  drawDetail();
};
$('showPrice').onchange = drawDetail;
$('logScale').onchange = drawDetail;

$('editToggle').onclick = () => {
  const on = document.body.classList.toggle('editing');
  $('editToggle').textContent = on ? '✓ 편집 끝내기' : '✎ 데이터 편집';
};

$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(OV, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'overrides.json';
  a.click();
  URL.revokeObjectURL(a.href);
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async () => {
  const f = $('importFile').files[0];
  if (!f) return;
  try { OV = tidy(JSON.parse(await f.text())); saveLocal(); drawPage(currentCoin()); }
  catch { alert('파일을 읽지 못했어요. overrides.json 파일이 맞는지 확인해 주세요.'); }
  $('importFile').value = '';
};
$('resetBtn').onclick = () => {
  if (!confirm('이 브라우저에서 고친 내용을 모두 지우고, GitHub에 올라가 있는 버전으로 되돌릴까요?')) return;
  try { localStorage.removeItem(LS_KEY); } catch {}
  OV = JSON.parse(JSON.stringify(PUBLISHED));
  updateEditCount();
  drawPage(currentCoin());
};

window.addEventListener('hashchange', renderCoin);

// 시작! (시세와 저장된 수정본을 먼저 불러오고, 코인 화면 그리기)
drawTabs();
Promise.all([loadOverrides(), loadMarket()]).then(() => { updateEditCount(); renderCoin(); });
</script>
</body>
</html>
