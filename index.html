<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChainLens · 코인별 온체인 데이터</title>

<!-- 차트 그리는 도구 (TradingView에서 무료로 공개한 라이브러리) -->
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

<style>
  /* ===== 색상표: 여기 값만 바꾸면 사이트 전체 색이 바뀌어요 ===== */
  :root {
    --bg: #ffffff;       /* 배경 */
    --soft: #f4f4f7;     /* 살짝 회색 배경 */
    --line: #ececf0;     /* 테두리 */
    --text: #17171c;     /* 글자 */
    --muted: #7a7a86;    /* 흐린 글자 */
    --brand: #5a48e0;    /* 강조색 (보라) */
    --brand-soft: #f1effd;
    --up: #0fa86b;       /* 상승 (초록) */
    --down: #e5484d;     /* 하락 (빨강) */
    --bar: #13a26b;      /* 차트 막대 (초록) */
    --priceline: #17171c;/* 차트 가격선 (검정) */
    --sma: #f2a93b;      /* 이동평균선 */
    --ema: #2f80ed;      /* 지수이동평균선 */
    --star: #f5b400;     /* 즐겨찾기 별 */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, select { font: inherit; }
  a { color: inherit; }
  .num { font-variant-numeric: tabular-nums; }

  /* ===== 맨 위 막대 ===== */
  header {
    display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 24px;
    border-bottom: 1px solid var(--line); background: var(--bg);
    position: sticky; top: 0; z-index: 20;
  }
  .brand { font-weight: 800; font-size: 18px; letter-spacing: -.02em; text-decoration: none; }
  .brand span { color: var(--brand); }
  header .spacer { flex: 1; }
  #editToggle {
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  body.editing #editToggle { background: var(--brand); border-color: var(--brand); color: #fff; }

  /* ===== 코인 탭 ===== */
  .coins { display: flex; gap: 2px; overflow-x: auto; padding: 0 24px;
           border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .coins a {
    flex: none; display: flex; align-items: center; gap: 6px; padding: 12px 12px 10px;
    text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 600;
    border-bottom: 2px solid transparent;
  }
  .coins a.on { color: var(--text); border-bottom-color: var(--text); }
  .coins img, .coin-dot { width: 18px; height: 18px; border-radius: 50%; display: inline-block; background: var(--soft); }

  /* ===== 전체 배치: 왼쪽 메뉴 + 본문 ===== */
  .shell { display: grid; grid-template-columns: 270px minmax(0, 1fr); }
  body.side-closed .shell { grid-template-columns: minmax(0, 1fr); }
  body.side-closed aside { display: none; }

  aside {
    border-right: 1px solid var(--line); padding: 16px 12px;
    position: sticky; top: 52px; height: calc(100vh - 52px); overflow-y: auto; background: var(--bg);
  }
  .side-top { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 10px; }
  .side-top b { font-size: 15px; }
  .iconbtn { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px 6px; border-radius: 6px; line-height: 1; }
  .iconbtn:hover { background: var(--soft); color: var(--text); }
  #search { width: 100%; margin-bottom: 10px; }

  .cat-h {
    display: flex; align-items: center; gap: 6px; padding: 9px 8px; border-radius: 7px;
    font-size: 14px; cursor: pointer; user-select: none;
  }
  .cat-h:hover { background: var(--soft); }
  .cat-h .arr { width: 14px; color: var(--muted); font-size: 10px; transition: transform .15s; }
  .cat.open .arr { transform: rotate(90deg); }
  .cat-h a { flex: 1; text-decoration: none; }
  .cat-h.on a { color: var(--brand); font-weight: 700; }
  .cat-items { display: none; padding: 2px 0 6px 22px; }
  .cat.open .cat-items { display: block; }
  .cat-items a {
    display: block; padding: 6px 8px; font-size: 13px; color: var(--muted);
    text-decoration: none; border-radius: 6px;
  }
  .cat-items a:hover { color: var(--text); background: var(--soft); }
  .cat-items a.on { color: var(--brand); background: var(--brand-soft); font-weight: 600; }
  .cat-items .none { font-size: 12px; color: var(--muted); padding: 6px 8px; }
  .newtag { font-size: 10px; color: #fff; background: var(--brand); border-radius: 4px; padding: 1px 5px; margin-left: 4px; vertical-align: 1px; }

  main { padding: 26px 36px 40px; min-width: 0; }
  #sideOpen { display: none; margin-bottom: 14px; }
  body.side-closed #sideOpen { display: inline-block; }

  /* ===== 편집 모드 안내 ===== */
  .editbar {
    display: none; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; line-height: 1.6;
    background: var(--brand-soft); border: 1px solid #d9d3fb; border-radius: 10px; padding: 10px 14px; margin-bottom: 24px;
  }
  body.editing .editbar { display: flex; }
  .editbar p { margin: 0; flex: 1 1 320px; color: #4a4a57; }
  .btn { border: 1px solid var(--line); background: var(--bg); color: var(--text);
         padding: 6px 11px; border-radius: 7px; cursor: pointer; font-size: 13px; }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }

  /* ===== 개요: 코인 요약 ===== */
  .hero { display: flex; flex-wrap: wrap; align-items: center; gap: 20px 0; margin-bottom: 44px; }
  .hero .id { display: flex; align-items: center; gap: 14px; padding-right: 28px; }
  .hero .id img, .hero .id .coin-dot { width: 52px; height: 52px; }
  .hero .nm { font-size: 17px; font-weight: 700; }
  .hero .nm small { color: var(--muted); font-weight: 500; margin-left: 4px; font-size: 14px; }
  .hero .px { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .hero .stat { border-left: 1px solid var(--line); padding: 2px 18px; }
  .hero .stat small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .hero .stat b { font-size: 14px; font-weight: 600; }
  .up { color: var(--up) !important; } .dn { color: var(--down) !important; }

  h2.title { font-size: 24px; margin: 0 0 8px; letter-spacing: -.02em; }
  .lead { color: var(--muted); font-size: 14px; margin: 0 0 22px; line-height: 1.6; }
  .notice { background: var(--soft); border: 1px solid var(--line); border-radius: 10px;
            padding: 12px 14px; font-size: 13px; color: #4a4a57; margin-bottom: 22px; line-height: 1.6; }

  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 36px 40px; margin-bottom: 30px; }
  .panel h3 { font-size: 16px; margin: 0 0 12px; display: flex; justify-content: space-between; }
  .panel h3 a { font-size: 12px; color: var(--brand); font-weight: 600; text-decoration: none; }
  .phead { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted);
           padding: 8px 0; border-bottom: 1px solid var(--line); }
  .prow { display: flex; align-items: center; justify-content: space-between; gap: 14px;
          padding: 14px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
  .prow:hover .pname { color: var(--brand); }
  .prow .txt { min-width: 0; }
  .pname { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .pdesc { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { flex: none; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 6px; }
  .s-good { color: #0b7a4f; background: #e3f6ee; }
  .s-bad  { color: #c22f35; background: #fde8e9; }
  .s-warn { color: #a35f00; background: #fff1d9; }
  .s-mid  { color: #55555f; background: #eeeef2; }
  .edited { font-size: 11px; color: var(--brand); font-weight: 600; margin-left: 6px; }

  /* ===== 카테고리 표 ===== */
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px;
            padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .tbl td { padding: 16px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tr.click { cursor: pointer; }
  .tbl tr.click:hover td { background: var(--soft); }
  .tbl .star { width: 36px; }
  .starbtn { background: none; border: 0; cursor: pointer; font-size: 17px; color: #c9c9d1; padding: 0; }
  .starbtn.on { color: var(--star); }
  .tbl .mname { font-weight: 600; white-space: nowrap; }
  .tbl .mdesc { color: #55555f; max-width: 520px; line-height: 1.55; }
  .tbl .r { text-align: right; white-space: nowrap; }
  .tbl svg { width: 130px; height: 36px; display: block; margin-left: auto; }
  .nodata { color: var(--muted); font-size: 12px; }
  .memo { display: block; color: var(--brand); font-size: 12px; font-weight: 500; margin-top: 3px; white-space: pre-wrap; }

  /* ===== 지표 차트 페이지 ===== */
  .crumb { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .crumb a { color: var(--muted); text-decoration: none; }
  .crumb a:hover { color: var(--brand); }

  .ccard { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
  .chead { display: flex; align-items: center; justify-content: space-between; gap: 10px;
           padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .chead b { font-size: 16px; }
  .cicons { display: flex; gap: 4px; }
  .cicons .iconbtn { font-size: 15px; padding: 6px 8px; }
  .cicons .starbtn { font-size: 16px; padding: 6px 8px; }
  .cbody { padding: 16px 20px 18px; }

  /* 차트 위 선택 칸들 (거래소 / 단위 / 이평 …) */
  .controls { display: inline-flex; flex-wrap: wrap; background: var(--soft); border-radius: 8px; padding: 4px; margin-bottom: 14px; }
  .ctl { display: flex; flex-direction: column; padding: 4px 10px; border-left: 1px solid #e2e2e8; }
  .ctl:first-child { border-left: 0; }
  .ctl small { font-size: 11px; color: var(--muted); }
  .ctl select { border: 0; background: transparent; font-size: 13px; font-weight: 600; color: var(--text);
                padding: 2px 0; cursor: pointer; min-width: 64px; }
  .ctl select:focus { outline: none; }

  .rangebar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 6px; }
  .range { display: flex; border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .range button { border: 0; background: none; color: var(--muted); padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .range button.on { color: var(--brand); font-weight: 700; }
  .mval { font-size: 13px; color: var(--muted); }
  .mval b { color: var(--text); font-size: 15px; margin-left: 4px; }

  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; font-size: 12px; color: #4a4a57; margin: 10px 0 6px; }
  .legend i { display: inline-block; vertical-align: middle; margin-right: 6px; }
  .lg-line { width: 14px; height: 2px; }
  .lg-dot { width: 9px; height: 9px; border-radius: 50%; }

  .chartbox { position: relative; height: min(560px, 60vh); }
  #chart { position: absolute; inset: 0; }
  #chartMsg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
              color: var(--muted); font-size: 14px; padding: 20px; pointer-events: none; line-height: 1.7; }
  .ccard:fullscreen { border-radius: 0; overflow: auto; }
  .ccard:fullscreen .chartbox { height: calc(100vh - 230px); }

  /* 차트 카드 제목 · 위쪽 줄 */
  .ctitle { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ctitle img, .ctitle .coin-dot { width: 22px; height: 22px; flex: none; }
  .ctop { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .ctop .controls { margin-bottom: 6px; }
  .range button + button { border-left: 1px solid var(--line); border-radius: 0; }
  .draghint { font-size: 12px; color: #4a3bc4; background: var(--brand-soft); border-radius: 7px;
              padding: 7px 11px; margin: 8px 0 0; line-height: 1.5; }
  .chartbox.dragmode { cursor: ns-resize; }
  .ctl input.ymax { border: 0; background: transparent; padding: 2px 0; width: 104px; font-weight: 600; font-size: 13px; }
  .chartbox.dragmode #chart { touch-action: none; }

  /* 아래 미니 차트 (보이는 구간 조절) */
  .navi { position: relative; height: 58px; margin-top: 6px; border: 1px solid var(--line); border-radius: 6px;
          user-select: none; touch-action: none; cursor: pointer; overflow: hidden; }
  #naviSvg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .navwin { position: absolute; top: 0; bottom: 0; background: rgba(90,72,224,.09);
            border-left: 1px solid #a9a9b6; border-right: 1px solid #a9a9b6; cursor: grab; }
  .navwin .h { position: absolute; top: 50%; width: 9px; height: 20px; margin-top: -10px; background: #fff;
               border: 1px solid #8f8f9c; border-radius: 3px; cursor: ew-resize; }
  .navwin .h[data-h="l"] { left: -5px; }
  .navwin .h[data-h="r"] { right: -5px; }

  .about { margin-top: 26px; }
  .about h3 { font-size: 16px; margin: 0 0 8px; }
  .about p { color: #4a4a57; font-size: 14px; line-height: 1.7; margin: 0; max-width: 860px; }

  /* ===== 편집 영역 (편집 모드일 때만) ===== */
  #editArea { display: none; margin-top: 26px; border: 1px solid #d9d3fb; border-radius: 12px; padding: 16px 18px; }
  body.editing #editArea { display: block; }
  #editArea h4 { margin: 0 0 8px; font-size: 15px; color: var(--brand); }
  #editArea h5 { margin: 18px 0 6px; font-size: 13px; }
  #editArea .hint { color: var(--muted); font-size: 12px; margin: 0 0 10px; line-height: 1.6; }
  .addrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  input, textarea { background: var(--bg); color: var(--text); border: 1px solid #d8d8e0;
                    border-radius: 7px; padding: 6px 9px; font: inherit; font-size: 13px; }
  input:focus, textarea:focus { outline: none; border-color: var(--brand); }
  .tablewrap { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
  .etbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .etbl th, .etbl td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; }
  .etbl th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--soft); }
  .etbl td input { width: 100%; min-width: 110px; }
  .etbl tr.changed td { background: var(--brand-soft); }
  textarea { width: 100%; min-height: 60px; resize: vertical; }
  #bulk { min-height: 110px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }

  .loading { color: var(--muted); padding: 80px 0; text-align: center; }
  footer { color: var(--muted); font-size: 12px; line-height: 1.7; border-top: 1px solid var(--line);
           padding-top: 18px; margin-top: 48px; }
  footer a { color: var(--muted); }
  #sideShade { display: none; }

  /* ===== 태블릿·휴대폰 ===== */
  @media (max-width: 960px) {
    .shell, body.side-closed .shell { grid-template-columns: minmax(0, 1fr); }
    aside, body.side-closed aside {
      display: block; position: fixed; top: 0; left: 0; bottom: 0; height: 100vh; width: 290px;
      z-index: 40; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.15);
    }
    body.side-open aside { transform: none; }
    body.side-open #sideShade { display: block; position: fixed; inset: 0; background: rgba(20,20,30,.35); z-index: 35; }
    #sideOpen, body.side-closed #sideOpen { display: inline-block; }
    .panels { grid-template-columns: 1fr; }
    .tbl .mdesc, .tbl .col-desc { display: none; }
    main { padding: 20px 16px 32px; }
  }
  @media (max-width: 640px) {
    header, .coins { padding-left: 16px; padding-right: 16px; }
    .hero { gap: 14px 0; }
    .hero .id { width: 100%; }
    .hero .stat { flex: 1 1 33%; padding: 2px 10px; }
    .hero .stat:nth-of-type(4) { border-left: 0; padding-left: 0; }
    .tbl .col-spark, .tbl td.spark { display: none; }
    .tbl td { padding: 14px 8px; }
    .chead, .cbody { padding-left: 12px; padding-right: 12px; }
    .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; }
    .ctl { border-left: 0; }
    .chartbox { height: 360px; }
  }
</style>
</head>
<body>

<header>
  <a class="brand" href="#">Chain<span>Lens</span></a>
  <span class="spacer"></span>
  <button id="editToggle">✎ 데이터 편집</button>
</header>

<nav class="coins" id="coins"></nav>

<div class="shell">
  <!-- 왼쪽 지표 메뉴 -->
  <aside id="side">
    <div class="side-top">
      <b>지표</b>
      <button class="iconbtn" id="sideClose" title="메뉴 접기">⇤</button>
    </div>
    <input id="search" placeholder="지표 검색">
    <div id="tree"></div>
  </aside>
  <div id="sideShade"></div>

  <main>
    <button class="btn" id="sideOpen">☰ 지표 목록</button>

    <div class="editbar">
      <p>
        <b>편집 모드</b> · 지표를 눌러 값을 고치거나 직접 입력하고, 메모를 남겨 보세요. 고친 내용은 이 브라우저에 바로 저장돼요.
        다른 기기에서도 보려면 <b>파일로 내보내기</b> → 받은 <b>overrides.json</b>을 GitHub 저장소에 올리세요.
        <span id="editCount"></span>
      </p>
      <button class="btn primary" id="exportBtn">파일로 내보내기</button>
      <button class="btn" id="importBtn">파일 불러오기</button>
      <button class="btn" id="resetBtn">게시된 버전으로 되돌리기</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>

    <div id="page"><div class="loading">데이터 불러오는 중…</div></div>

    <footer>
      온체인 데이터: <a href="https://coinmetrics.io/community-network-data/" target="_blank" rel="noopener">Coin Metrics Community Data</a> (CC BY-NC 4.0) ·
      시세: <a href="https://www.coingecko.com/" target="_blank" rel="noopener">CoinGecko</a> ·
      상태 표시는 단순한 기준으로 자동 계산한 값이며 투자 조언이 아닙니다.
    </footer>
  </main>
</div>

<script>
/* =====================================================================
   1) 코인 목록
   - cg: CoinGecko 이름 (시세·아이콘용)
   - m: Coin Metrics에서 무료로 받을 수 있는 지표 목록
   - 시바이누는 무료 온체인 데이터가 없어서 가격만 받고, 나머지는 직접 입력해요
   ===================================================================== */
const COMMON = ['PriceUSD', 'CapMrktCurUSD', 'CapMVRVCur', 'AdrActCnt', 'TxCnt', 'TxTfrCnt', 'AdrBalCnt', 'SplyCur', 'ROI30d'];
const FLOWS  = ['FlowInExNtv', 'FlowOutExNtv', 'FlowInExUSD', 'FlowOutExUSD', 'SplyExNtv'];
const COINS = [
  { id: 'btc',  cg: 'bitcoin',      name: '비트코인',     sym: 'BTC',  m: [...COMMON, ...FLOWS, 'FeeTotNtv', 'HashRate', 'IssTotUSD'] },
  { id: 'eth',  cg: 'ethereum',     name: '이더리움',     sym: 'ETH',  m: [...COMMON, ...FLOWS, 'FeeTotNtv', 'IssTotUSD'] },
  { id: 'xrp',  cg: 'ripple',       name: '리플',         sym: 'XRP',  m: [...COMMON, 'FeeTotNtv'] },
  { id: 'usdt', cg: 'tether',       name: '테더',         sym: 'USDT', m: [...COMMON] },
  { id: 'shib', cg: 'shiba-inu',    name: '시바이누',     sym: 'SHIB', m: ['PriceUSD'] },

/* =====================================================================

   - 온체인: Coin Metrics 무료 API
   - 시세·거래량·아이콘: CoinGecko 무료 API
   ===================================================================== */
const API = 'https://community-api.coinmetrics.io/v4/timeseries/asset-metrics';
const raw = {};       // raw.btc.PriceUSD = Map('2026-10-11' → 값)
let MARKET = {};      // MARKET.bitcoin = { current_price, image, ... }
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function loadMarket() {
  try {
    const ids = COINS.map(c => c.cg).join(',');
    const r = await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${ids}&price_change_percentage=24h,7d`);
    for (const m of await r.json()) MARKET[m.id] = m;
  } catch {}
}

async function getRows(id, metrics, tries = 0) {
  const url = `${API}?assets=${id}&metrics=${metrics.join(',')}&frequency=1d&page_size=10000&paging_from=end`;
  const res = await fetch(url);
  if (res.status === 429 && tries < 4) {          // 요청이 너무 많으면 잠깐 쉬었다가 다시
    await sleep(2000 * (tries + 1));
    return getRows(id, metrics, tries + 1);
  }
  const json = await res.json();
  if (json.error) throw new Error(json.error.message);
  return json.data;
}

async function fetchCoin(c) {
  if (raw[c.id]) return raw[c.id];
  let rows;
  try {
    rows = await getRows(c.id, c.m);
  } catch (e) {
    rows = [];
    for (const m of c.m) { try { rows.push(...await getRows(c.id, [m])); } catch {} }
  }
  const out = {};
  for (const m of c.m) out[m] = new Map();
  for (const r of rows) {
    const day = r.time.slice(0, 10);
    for (const m of c.m) if (r[m] != null && r[m] !== '') out[m].set(day, parseFloat(r[m]));
  }
  return (raw[c.id] = out);
}

/* =====================================================================

   - { values: { btc: { PriceUSD: { '2026-10-11': 82000 } } }, notes: { btc: { CapMVRVCur: '메모' } } }
   ===================================================================== */
const LS_KEY = 'chainlens-overrides', FAV_KEY = 'chainlens-favs';
let PUBLISHED = { values: {}, notes: {} };
let OV = { values: {}, notes: {} };
let FAVS = [];
const tidy = o => ({ values: (o && o.values) || {}, notes: (o && o.notes) || {} });

async function loadOverrides() {
  try {
    const r = await fetch('overrides.json', { cache: 'no-store' });
    if (r.ok) PUBLISHED = tidy(await r.json());
  } catch {}
  let local = null;
  try { local = JSON.parse(localStorage.getItem(LS_KEY)); } catch {}
  OV = tidy(local || JSON.parse(JSON.stringify(PUBLISHED)));
  try { FAVS = JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch {}
}
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(OV)); } catch {}
  updateEditCount();
}
function toggleFav(key) {
  FAVS = FAVS.includes(key) ? FAVS.filter(k => k !== key) : [...FAVS, key];
  try { localStorage.setItem(FAV_KEY, JSON.stringify(FAVS)); } catch {}
}
// 값 여러 개를 한 번에 저장 (pairs: [['2026-10-11', 123], ...], 값이 ''면 지우기)
function setValues(coinId, key, pairs) {
  const byCoin = (OV.values[coinId] ??= {});
  const byKey = (byCoin[key] ??= {});
  for (const [day, value] of pairs) {
    if (value === '' || value == null || !isFinite(value)) delete byKey[day];
    else byKey[day] = Number(value);
  }
  if (!Object.keys(byKey).length) delete byCoin[key];
  if (!Object.keys(byCoin).length) delete OV.values[coinId];
  saveLocal();
}
const setValue = (coinId, key, day, value) => setValues(coinId, key, [[day, value]]);
function setNote(coinId, key, text) {
  const byCoin = (OV.notes[coinId] ??= {});
  if (text.trim()) byCoin[key] = text; else delete byCoin[key];
  if (!Object.keys(byCoin).length) delete OV.notes[coinId];
  saveLocal();
}
const editsOf = (coinId, key) => (OV.values[coinId] && OV.values[coinId][key]) || {};
const noteOf  = (coinId, key) => (OV.notes[coinId] && OV.notes[coinId][key]) || '';
function editedDays(coinId, def) {
  const keys = def.needs || [def.key];
  return [...new Set(keys.flatMap(k => Object.keys(editsOf(coinId, k))))].sort();
}
function updateEditCount() {
  let n = 0, m = 0;
  for (const c of Object.values(OV.values)) for (const k of Object.values(c)) n += Object.keys(k).length;
  for (const c of Object.values(OV.notes)) m += Object.keys(c).length;
  document.getElementById('editCount').textContent = `(지금 고친 값 ${n}개 · 메모 ${m}개)`;

/* =====================================================================
   5) 지표 데이터 만들기 (원본 + 내가 고친 값 합치기)
   ===================================================================== */
function baseMap(coinId, key) {
  const m = new Map((raw[coinId] && raw[coinId][key]) || []);
  for (const [day, v] of Object.entries(editsOf(coinId, key))) m.set(day, v);
  return m;
}
function seriesMap(coinId, def) {
  if (!def.calc) return baseMap(coinId, def.key);
  const [a, b] = def.needs.map(k => baseMap(coinId, k));
  const out = new Map();
  for (const [day, va] of a) { const vb = b.get(day); if (vb != null) out.set(day, def.calc(va, vb)); }
  return out;
}
const toArr = map => [...map].sort((x, y) => (x[0] < y[0] ? -1 : 1)).map(([time, value]) => ({ time, value }));
const series = (c, def) => toArr(seriesMap(c.id, def));

/* 일 → 주/월 단위로 묶기 */
function bucket(day, win) {
  if (win === 'MONTH') return day.slice(0, 7) + '-01';
  const d = new Date(day + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7);   // 그 주 월요일
  return d.toISOString().slice(0, 10);
}
function aggregate(arr, win, how) {
  if (win === 'DAY') return arr;
  const groups = new Map();
  for (const p of arr) {
    const k = bucket(p.time, win);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(p.value);
  }
  return [...groups].map(([time, v]) => ({
    time,
    value: how === 'sum' ? v.reduce((a, b) => a + b, 0)
         : how === 'avg' ? v.reduce((a, b) => a + b, 0) / v.length
         : v[v.length - 1],
  }));
}
/* 이동평균(SMA) · 지수이동평균(EMA) */
function sma(arr, n) {
  const out = []; let s = 0;
  arr.forEach((p, i) => { s += p.value; if (i >= n) s -= arr[i - n].value; if (i >= n - 1) out.push({ time: p.time, value: s / n }); });
  return out;
}
function ema(arr, n) {
  const k = 2 / (n + 1), out = []; let e;
  arr.forEach((p, i) => { e = i === 0 ? p.value : p.value * k + e * (1 - k); if (i >= n - 1) out.push({ time: p.time, value: e }); });
  return out;
}

/* =====================================================================
   6) 숫자 보기 좋게 바꾸기
   ===================================================================== */
function short(v) {
  const a = Math.abs(v);
  if (a >= 1e12) return (v / 1e12).toFixed(2) + 'T';
  if (a >= 1e9)  return (v / 1e9).toFixed(2) + 'B';
  if (a >= 1e6)  return (v / 1e6).toFixed(2) + 'M';
  if (a >= 1000) return Math.round(v).toLocaleString('en-US');
  if (a >= 1)    return v.toFixed(2);
  if (a === 0)   return '0';
  return Number(v.toPrecision(3)).toString();
}
function hash(th) {   // 원본 단위: TH/s
  for (const [u, f] of [['EH/s', 1e6], ['PH/s', 1e3], ['TH/s', 1], ['GH/s', 1e-3]])
    if (th >= f) return (th / f).toFixed(2) + ' ' + u;
  return (th * 1e6).toFixed(2) + ' MH/s';
}
function fmt(v, def, c) {
  if (v == null || !isFinite(v)) return '–';
  switch (def.fmt) {
    case 'usd':   return (v < 0 ? '-$' : '$') + short(Math.abs(v));
    case 'ratio': return v.toFixed(4);
    case 'pct':   return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
    case 'hash':  return hash(v);
    case 'coin':  return short(v) + ' ' + c.sym;
    default:      return short(v);
  }
}
const fullUsd = v => v == null ? '–' : '$' + (v >= 1 ? v.toLocaleString('en-US', { maximumFractionDigits: 2 }) : Number(v.toPrecision(4)));
const pctTxt = v => v == null || !isFinite(v) ? '–' : (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
const pctCls = v => v == null || !isFinite(v) ? '' : v >= 0 ? 'up' : 'dn';
const rawUnit = (def, c) => ({ usd: 'USD', ratio: '배', pct: '%', hash: 'TH/s', coin: c.sym })[def.fmt] || '개';
const avg = a => a.reduce((s, x) => s + x.value, 0) / (a.length || 1);
const lastOf = a => a.length ? a[a.length - 1].value : null;
const chg24 = a => a.length > 1 && a[a.length - 2].value ? (lastOf(a) - a[a.length - 2].value) / Math.abs(a[a.length - 2].value) * 100 : null;

/* =====================================================================
   7) 상태 표시 — 단순한 기준으로 자동 계산
   ===================================================================== */
function status(def, arr) {
  if (arr.length < 31) return { t: 'N/A', c: 'mid' };
  const last = lastOf(arr);
  const vs90 = avg(arr.slice(-7)) / avg(arr.slice(-90)) - 1;
  switch (def.key) {
    case 'CapMVRVCur':
      return last < 1 ? { t: 'Undervalued', c: 'good' } : last > 3.5 ? { t: 'Overheated', c: 'bad' }
           : last > 2.4 ? { t: 'Caution', c: 'warn' } : { t: 'Neutral', c: 'mid' };
    case 'NetflowUSD': case 'NetflowNtv':
      return arr.slice(-7).reduce((x, p) => x + p.value, 0) > 0 ? { t: 'Bearish', c: 'bad' } : { t: 'Bullish', c: 'good' };
    case 'FlowInExUSD': case 'FlowInExNtv':
      return vs90 > 0.15 ? { t: 'High Inflow', c: 'bad' } : { t: 'Normal', c: 'mid' };
    case 'FlowOutExUSD': case 'FlowOutExNtv':
      return vs90 > 0.15 ? { t: 'High Outflow', c: 'good' } : { t: 'Normal', c: 'mid' };
    case 'SplyExNtv':
      return last < arr[arr.length - 31].value ? { t: 'Bullish', c: 'good' } : { t: 'Bearish', c: 'bad' };
    case 'ROI30d':
      return last > 30 ? { t: 'Overheated', c: 'warn' } : last < -20 ? { t: 'Oversold', c: 'good' } : { t: 'Neutral', c: 'mid' };
    case 'HashRate':
      return vs90 > 0.03 ? { t: 'Rising', c: 'good' } : vs90 < -0.03 ? { t: 'Falling', c: 'bad' } : { t: 'Stable', c: 'mid' };
    case 'AdrActCnt': case 'TxCnt': case 'TxTfrCnt': case 'FeeTotUSD': case 'FeeTotNtv':
      return vs90 > 0.05 ? { t: 'Active', c: 'good' } : vs90 < -0.05 ? { t: 'Quiet', c: 'bad' } : { t: 'Normal', c: 'mid' };
    default:
      return vs90 > 0.05 ? { t: 'Rising', c: 'good' } : vs90 < -0.05 ? { t: 'Falling', c: 'bad' } : { t: 'Neutral', c: 'mid' };
  }
}

/* 표 속 작은 그래프 (최근 7일) */
function sparkline(arr) {
  const pts = arr.slice(-7);
  if (pts.length < 2) return '';
  const W = 130, H = 36, vals = pts.map(p => p.value);
  const min = Math.min(...vals), max = Math.max(...vals);
  const y = v => H - 3 - (v - min) / ((max - min) || 1) * (H - 6);
  const d = pts.map((p, i) => `${(i / (pts.length - 1) * W).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  const color = vals[vals.length - 1] >= vals[0] ? 'var(--up)' : 'var(--down)';
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${d}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

/* =====================================================================
   8) 주소(#) 읽기
   - #btc                               → 개요
   - #btc/flows                         → 카테고리 표
   - #btc/flows/SplyExNtv?window=DAY…   → 지표 차트 (? 뒤는 차트 설정)
   ===================================================================== */
const $ = id => document.getElementById(id);
function route() {
  const [path, query] = location.hash.slice(1).split('?');
  const [id, cat, key] = path.split('/');
  const c = COINS.find(x => x.id === id) || COINS[0];
  return { c, cat: CATS.find(x => x.id === cat) || (cat === 'favs' ? 'favs' : null), def: metricByKey(key),
           path, opts: new URLSearchParams(query || '') };
}
const link = (c, cat, key) => '#' + [c.id, cat, key].filter(Boolean).join('/');
const icon = c => MARKET[c.cg] && MARKET[c.cg].image ? `<img src="${MARKET[c.cg].image}" alt="">` : `<span class="coin-dot"></span>`;

/* ----- 코인 탭 (코인을 바꿔도 보고 있던 지표·차트 설정은 그대로) ----- */
function drawTabs() {
  const { c } = route();
  const hash = location.hash.slice(1);
  const rest = hash.includes('/') ? hash.slice(hash.indexOf('/')) : hash.includes('?') ? hash.slice(hash.indexOf('?')) : '';
  $('coins').innerHTML = COINS.map(x =>
    `<a href="#${x.id}${rest}" class="${x === c ? 'on' : ''}">${icon(x)}${x.sym}</a>`).join('');
}

/* ----- 왼쪽 메뉴 ----- */
const openCats = new Set();
function drawSide() {
  const { c, cat, def } = route();
  const curCat = def ? def.cat : (cat && cat.id) || (cat === 'favs' ? 'favs' : null);
  if (curCat) openCats.add(curCat);
  const q = $('search').value.trim().toLowerCase();
  const match = m => !q || m.name.toLowerCase().includes(q);
  const item = m => `<a href="${link(c, m.cat, m.key)}" class="${def === m ? 'on' : ''}">${m.name}</a>`;

  const groups = [
    { id: 'favs', name: '☆ 즐겨찾기', list: FAVS.map(metricByKey).filter(Boolean).filter(match) },
    { id: '', name: '개요', list: null },
    ...CATS.map(k => ({ id: k.id, name: k.name, isNew: k.isNew, list: METRICS.filter(m => m.cat === k.id && match(m)) })),
  ];
  $('tree').innerHTML = groups.map(g => {
    if (!g.list) {   // 개요는 펼칠 것 없이 바로 이동
      return `<div class="cat"><div class="cat-h ${!cat && !def ? 'on' : ''}"><span class="arr"></span><a href="${link(c)}">${g.name}</a></div></div>`;
    }
    if (q && !g.list.length) return '';
    const open = q || openCats.has(g.id);
    return `
      <div class="cat ${open ? 'open' : ''}" data-cat="${g.id}">
        <div class="cat-h ${curCat === g.id && !def ? 'on' : ''}">
          <span class="arr">▶</span>
          <a href="${link(c, g.id)}">${g.name}${g.isNew ? '<span class="newtag">NEW</span>' : ''}</a>
        </div>
        <div class="cat-items">
          ${g.list.length ? g.list.map(item).join('') : '<div class="none">지표 옆 ☆를 눌러 추가해 보세요</div>'}
        </div>
      </div>`;
  }).join('');

  // 화살표 부분을 누르면 펼치기/접기만
  $('tree').querySelectorAll('.cat[data-cat] .arr').forEach(a => a.onclick = () => {
    const id = a.closest('.cat').dataset.cat;
    openCats.has(id) ? openCats.delete(id) : openCats.add(id);
    drawSide();
  });
}

/* =====================================================================
   9) 페이지 그리기
   ===================================================================== */
let chart = null, lastPath = null;

async function render() {
  drawTabs();
  drawSide();
  document.body.classList.remove('side-open');
  const { c, path } = route();
  if (!raw[c.id]) $('page').innerHTML = `<div class="loading">${c.name} 데이터 불러오는 중…</div>`;
  try { await fetchCoin(c); }
  catch (e) {
    $('page').innerHTML = `<div class="loading">데이터를 불러오지 못했어요. 잠시 후 새로고침해 주세요.<br>${e.message}</div>`;
    return;
  }
  if (c !== route().c) return;   // 그사이 다른 코인을 눌렀으면 그리지 않기
  const y = window.scrollY;
  drawPage();
  window.scrollTo(0, path === lastPath ? y : 0);   // 차트 설정만 바꿨으면 스크롤 위치 유지
  lastPath = path;
}
function drawPage() {
  const { c, cat, def } = route();
  if (chart) { chart.remove(); chart = null; }
  if (def) drawMetric(c, def);
  else if (cat) drawCategory(c, cat);
  else drawSummary(c);
}
const rerender = () => { const y = window.scrollY; drawPage(); drawSide(); window.scrollTo(0, y); };

function noDataNotice(c) {
  const has = METRICS.some(m => m.key !== 'PriceUSD' && series(c, m).length);
  return has ? '' : `<div class="notice">💡 <b>${c.name}</b>는 무료로 받을 수 있는 온체인 데이터가 없어서 가격만 자동으로 나와요.
    오른쪽 위 <b>✎ 데이터 편집</b>을 켜고 지표를 누르면, 날짜별 값을 직접 입력하거나 한 번에 붙여넣을 수 있어요.</div>`;
}

/* ----- 개요 페이지 ----- */
function drawSummary(c) {
  const m = MARKET[c.cg] || {};
  const price = series(c, metricByKey('PriceUSD'));
  const back = n => price.length > n ? price[price.length - 1 - n].value : null;
  const px     = m.current_price ?? lastOf(price);
  const ch24   = m.price_change_percentage_24h_in_currency ?? (lastOf(price) / back(1) - 1) * 100;
  const ch7    = m.price_change_percentage_7d_in_currency ?? (lastOf(price) / back(7) - 1) * 100;
  const mcap   = m.market_cap ?? lastOf(series(c, metricByKey('CapMrktCurUSD')));
  const supply = m.circulating_supply ?? lastOf(series(c, metricByKey('SplyCur')));
  const big = v => v ? Math.round(v).toLocaleString('en-US') : '–';

  let html = `
    <div class="hero">
      <div class="id">${icon(c)}
        <div><div class="nm">${c.name}<small>${c.sym}</small></div><div class="px num">${fullUsd(px)}</div></div>
      </div>
      <div class="stat"><small>24시 %</small><b class="num ${pctCls(ch24)}">${pctTxt(ch24)}</b></div>
      <div class="stat"><small>7일 %</small><b class="num ${pctCls(ch7)}">${pctTxt(ch7)}</b></div>
      <div class="stat"><small>시가총액</small><b class="num">${mcap ? '$' + big(mcap) : '–'}</b></div>
      <div class="stat"><small>거래량(24시)</small><b class="num">${m.total_volume ? '$' + big(m.total_volume) : '–'}</b></div>
      <div class="stat"><small>유통 공급량</small><b class="num">${supply ? big(supply) + ' ' + c.sym : '–'}</b></div>
    </div>
    ${noDataNotice(c)}
    <h2 class="title" style="margin-bottom:18px">주요 지표</h2>
    <div class="panels">`;

  for (const k of CATS) {
    const rows = METRICS.filter(d => d.cat === k.id).map(def => {
      const arr = series(c, def);
      if (!arr.length) return '';
      const st = status(def, arr);
      return `
        <a class="prow" href="${link(c, def.cat, def.key)}">
          <div class="txt">
            <div class="pname">${def.name}${editedDays(c.id, def).length ? '<span class="edited">✎ 수정됨</span>' : ''}</div>
            <div class="pdesc">${def.short}</div>
          </div>
          <span class="pill s-${st.c}">${st.t}</span>
        </a>`;
    }).join('');
    html += `
      <div class="panel">
        <h3>${k.name} <a href="${link(c, k.id)}">전체 보기 →</a></h3>
        <div class="phead"><span>지표</span><span>상태(24시)</span></div>
        ${rows.trim() || '<div class="prow"><span class="pdesc">아직 데이터가 없어요</span></div>'}
      </div>`;
  }
  $('page').innerHTML = html + '</div>';
}

/* ----- 카테고리 페이지 (표) ----- */
function drawCategory(c, cat) {
  const isFav = cat === 'favs';
  const list = isFav ? FAVS.map(metricByKey).filter(Boolean) : METRICS.filter(m => m.cat === cat.id);
  const title = isFav ? '즐겨찾기' : cat.name;
  const lead = isFav ? '☆를 눌러 모아 둔 지표예요.' : cat.desc;

  let html = `
    <h2 class="title">${title}${!isFav && cat.isNew ? ' <span class="newtag">NEW</span>' : ''}</h2>
    <p class="lead">${c.name}(${c.sym}) · ${lead}</p>
    ${noDataNotice(c)}
    <table class="tbl">
      <thead><tr>
        <th class="star"></th><th>지표</th><th class="col-desc">설명</th>
        <th class="r">최신 값</th><th class="r">24H (%)</th><th class="r col-spark">최근 7일</th>
      </tr></thead>
      <tbody>`;
  if (!list.length) html += `<tr><td colspan="6" class="nodata" style="text-align:center;padding:40px">아직 즐겨찾기한 지표가 없어요. 지표 옆 ☆를 눌러 보세요.</td></tr>`;
  for (const def of list) {
    const arr = series(c, def), memo = noteOf(c.id, def.key), ch = chg24(arr);
    html += `
      <tr class="click" data-href="${link(c, def.cat, def.key)}">
        <td class="star"><button class="starbtn ${FAVS.includes(def.key) ? 'on' : ''}" data-fav="${def.key}" title="즐겨찾기">★</button></td>
        <td class="mname">${def.name}${editedDays(c.id, def).length ? '<span class="edited">✎</span>' : ''}
          ${memo ? `<span class="memo" data-memo="${def.key}"></span>` : ''}</td>
        <td class="mdesc">${def.desc}</td>
        <td class="r num">${arr.length ? fmt(lastOf(arr), def, c) : '<span class="nodata">데이터 없음</span>'}</td>
        <td class="r num ${pctCls(ch)}">${pctTxt(ch)}</td>
        <td class="r spark">${sparkline(arr)}</td>
      </tr>`;
  }
  $('page').innerHTML = html + '</tbody></table>';
  document.querySelectorAll('[data-memo]').forEach(el => el.textContent = '메모: ' + noteOf(c.id, el.dataset.memo));
  document.querySelectorAll('tr[data-href]').forEach(tr => tr.onclick = () => location.hash = tr.dataset.href);
  document.querySelectorAll('[data-fav]').forEach(b => b.onclick = e => {
    e.stopPropagation(); toggleFav(b.dataset.fav); rerender();
  });
}

/* =====================================================================
   10) 지표 차트 페이지
   - 차트 설정은 주소 ? 뒤에 저장돼요 (window, sma, ema, scale, chartStyle, range)
   - 차트 스타일 '봉': 초록 막대만 남고, 막대를 마우스로 끌어서 길이(값)를 바꿀 수 있어요
   ===================================================================== */
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const OPTS = {
  window:     [['DAY', '1일'], ['WEEK', '1주'], ['MONTH', '1달']],
  sma:        [['0', '선택안함'], ['7', '7'], ['14', '14'], ['30', '30'], ['50', '50'], ['100', '100'], ['200', '200']],
  ema:        [['0', '선택안함'], ['7', '7'], ['14', '14'], ['30', '30'], ['50', '50'], ['100', '100'], ['200', '200']],
  scale:      [['linear', '선형'], ['log', '로그']],
  chartStyle: [['column', '바'], ['candle', '봉'], ['line', '선'], ['area', '영역']],
};
const RANGES = [['1w', '1주'], ['1m', '1월'], ['3m', '3월'], ['1y', '1년'], ['ytd', 'YTD'], ['all', 'All']];

function chartSettings(def, opts) {
  const cat = CATS.find(k => k.id === def.cat);
  const pick = (k, d) => { const v = opts.get(k); return OPTS[k].some(o => o[0] === v) ? v : d; };
  return {
    window: pick('window', 'DAY'), sma: pick('sma', '0'), ema: pick('ema', '0'),
    scale: pick('scale', 'linear'), chartStyle: pick('chartStyle', cat.style),
    range: RANGES.some(r => r[0] === opts.get('range')) ? opts.get('range') : '3m',
  };
}
// 설정 하나를 바꾸면 주소를 바꾸고 → 화면이 다시 그려져요
function setSetting(k, v) {
  const { path, opts } = route();
  opts.set(k, v);
  location.hash = path + '?' + opts.toString();
}
function rangeStart(lastDay, range) {
  if (range === 'all' || !lastDay) return '';
  if (range === 'ytd') return lastDay.slice(0, 4) + '-01-01';
  const d = new Date(lastDay + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - { '1w': 7, '1m': 30, '3m': 91, '1y': 365 }[range]);
  return d.toISOString().slice(0, 10);
}
function lastNDays(n) {
  const out = [], d = new Date();
  d.setUTCDate(d.getUTCDate() - n);
  for (let i = 0; i < n; i++) { d.setUTCDate(d.getUTCDate() + 1); out.push(d.toISOString().slice(0, 10)); }
  return out;
}
const pad2 = n => String(n).padStart(2, '0');

function drawMetric(c, def) {
  const { opts } = route();
  const S = chartSettings(def, opts);
  const cat = CATS.find(k => k.id === def.cat);
  const daily = series(c, def);
  const sel = (k, label) => `
    <label class="ctl"><small>${label}</small>
      <select data-set="${k}">${OPTS[k].map(([v, t]) => `<option value="${v}" ${S[k] === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
    </label>`;
  const title = `${c.name}: ${def.name}` + (def.cat === 'flows' ? ' - 전체 거래소' : '');

  $('page').innerHTML = `
    <div class="crumb"><a href="${link(c)}">${c.name}</a> › <a href="${link(c, cat.id)}">${cat.name}</a> › ${def.name}</div>
    <div class="ccard" id="ccard">
      <div class="chead">
        <div class="ctitle">${icon(c)}<b>${title}</b></div>
        <div class="cicons">
          <button class="starbtn ${FAVS.includes(def.key) ? 'on' : ''}" id="favBtn" title="즐겨찾기">★</button>
          <button class="iconbtn" id="linkBtn" title="이 차트 주소 복사">🔗</button>
          <button class="iconbtn" id="shotBtn" title="차트를 이미지로 저장">📷</button>
          <button class="iconbtn" id="fullBtn" title="전체 화면">⛶</button>
        </div>
      </div>
      <div class="cbody">
        <div class="ctop">
          <div class="controls">
            ${def.cat === 'flows' ? `<label class="ctl"><small>거래소</small><select><option>전체 거래소</option></select></label>` : ''}
            ${sel('window', '단위')}
            ${sel('sma', '이평')}
            ${sel('ema', '지수이평')}
            ${sel('scale', '눈금(스케일)')}
            ${sel('chartStyle', '차트 스타일')}
            ${S.chartStyle === 'candle' ? `<label class="ctl"><small>눈금 최대</small>
              <input id="ymax" class="ymax" placeholder="자동 (예: 90T)" value="${(opts.get('ymax') || '').replace(/[^\w.]/g, '')}"></label>` : ''}
          </div>
          <div class="range">${RANGES.map(([v, t]) => `<button data-range="${v}" class="${S.range === v ? 'on' : ''}">${t}</button>`).join('')}</div>
        </div>
        <div class="draghint" id="dragHint" hidden></div>
        <div class="legend" id="legend"></div>
        <div class="chartbox" id="chartbox"><div id="chart"></div><div id="chartMsg"></div></div>
        <div class="navi" id="navi">
          <svg id="naviSvg"></svg>
          <div class="navwin" id="navWin"><span class="h" data-h="l"></span><span class="h" data-h="r"></span></div>
        </div>
      </div>
    </div>
    <div class="about">
      <h3>이 지표는?</h3>
      <p>${def.desc}</p>
    </div>
    <div id="editArea"></div>`;

  $('favBtn').onclick = () => { toggleFav(def.key); $('favBtn').classList.toggle('on'); drawSide(); };
  $('linkBtn').onclick = async () => {
    try { await navigator.clipboard.writeText(location.href); $('linkBtn').textContent = '✓'; } catch {}
    setTimeout(() => { if ($('linkBtn')) $('linkBtn').textContent = '🔗'; }, 1200);
  };
  $('fullBtn').onclick = () => document.fullscreenElement ? document.exitFullscreen() : $('ccard').requestFullscreen();
  $('shotBtn').onclick = () => {
    if (!chart) return;
    const a = document.createElement('a');
    a.href = chart.takeScreenshot().toDataURL('image/png');
    a.download = `${c.sym}-${def.key}.png`;
    a.click();
  };
  document.querySelectorAll('select[data-set]').forEach(s => s.onchange = () => setSetting(s.dataset.set, s.value));
  if ($('ymax')) $('ymax').onchange = () => setSetting('ymax', $('ymax').value.trim());
  document.querySelectorAll('[data-range]').forEach(b => b.onclick = () => setSetting('range', b.dataset.range));

  drawChart(c, def, daily, S);
  drawEditArea(c, def);
}

/* ----- 차트 그리기 ----- */
let chartData = [], mainSeries = null, navSync = null, navObserver = null;

function drawChart(c, def, daily, S) {
  const candle = S.chartStyle === 'candle';
  const canDrag = candle && S.window === 'DAY' && !def.calc;

  // 눈금에 쓰는 짧은 숫자 (90T, $1.5B …)
  const compact = a => a >= 1e12 ? +(a / 1e12).toFixed(1) + 'T' : a >= 1e9 ? +(a / 1e9).toFixed(1) + 'B'
                     : a >= 1e6 ? +(a / 1e6).toFixed(1) + 'M' : a >= 1e3 ? +(a / 1e3).toFixed(1) + 'K'
                     : String(Number(a.toPrecision(3)));
  const axis = v => def.fmt === 'hash' ? hash(v) : def.fmt === 'ratio' ? v.toFixed(2)
                  : def.fmt === 'pct' ? v.toFixed(1) + '%'
                  : (v < 0 ? '-' : '') + (def.fmt === 'usd' ? '$' : '') + compact(Math.abs(v));
  const pf = f => ({ type: 'custom', formatter: f, minMove: 1e-12 });
  const dayOf = t => typeof t === 'string' ? t : typeof t === 'number'
    ? new Date(t * 1000).toISOString().slice(0, 10) : `${t.year}-${pad2(t.month)}-${pad2(t.day)}`;

  chart = LightweightCharts.createChart($('chart'), {
    autoSize: true,
    layout: { background: { color: 'transparent' }, textColor: '#55555f', fontSize: 11 },
    grid: { vertLines: { visible: false }, horzLines: { color: '#f1f1f4' } },
    leftPriceScale: { visible: true, borderVisible: true, borderColor: cssVar('--bar'), scaleMargins: { top: 0.06, bottom: 0.03 } },
    rightPriceScale: { borderVisible: true, borderColor: cssVar('--priceline'), scaleMargins: { top: 0.06, bottom: 0.04 } },
    timeScale: {
      borderColor: cssVar('--line'), rightOffset: 1, barSpacing: 14, minBarSpacing: 0.3,
      tickMarkFormatter: (t, type) => {
        const [, m, d] = dayOf(t).split('-');
        return `${m} ${d}`;   // 항상 '월 일'만 (예: 10 01)
      },
    },
    localization: { timeFormatter: t => dayOf(t) },
    watermark: { visible: true, text: 'ChainLens', color: 'rgba(23,23,28,0.045)', fontSize: 56 },
    crosshair: { mode: 0 },
    handleScroll: canDrag ? { mouseWheel: true, pressedMouseMove: false, horzTouchDrag: false, vertTouchDrag: false } : true,
    handleScale: { axisPressedMouseMove: !canDrag, mouseWheel: true, pinch: true },
  });

  // 1) 일 → 주/월로 묶기
  const full = aggregate(daily, S.window, def.agg);
  chartData = full.map(p => ({ ...p }));
  // 봉 모드에서 데이터가 하나도 없으면, 가격이 있는 날짜(없으면 최근 1년)로 빈 칸을 만들어 끌어서 채울 수 있게
  if (canDrag && !chartData.length) {
    const days = toArr(baseMap(c.id, 'PriceUSD')).map(p => p.time).slice(-365);
    chartData = (days.length ? days : lastNDays(365)).map(time => ({ time, value: 0, ph: true }));   // ph: 아직 빈 칸
  }
  const n = chartData.length;
  const hasValue = chartData.some(p => p.value != null && !p.ph);
  // 봉 모드 '눈금 최대' (예: 90T, 1.5B) — 비워 두면 자동
  const unitMul = { K: 1e3, M: 1e6, B: 1e9, T: 1e12 };
  const ymaxTxt = (route().opts.get('ymax') || '').trim().toUpperCase();
  const ymaxM = ymaxTxt.match(/^([\d.]+)\s*([KMBT]?)$/);
  const ymax = ymaxM ? parseFloat(ymaxM[1]) * (unitMul[ymaxM[2]] || 1) : null;

  // 2) 지표 (왼쪽 눈금)
  const barColor = p => def.kind === 'hist' ? (p.value >= 0 ? cssVar('--down') : cssVar('--up')) : cssVar('--bar');
  // 막대는 '0에서 값까지 올라가는 캔들'로 그려요 → 막대 사이에 원본처럼 틈이 생겨요
  const colored = () => chartData.map(p => p.value == null ? { time: p.time } : {
    time: p.time, open: 0, close: p.value, high: Math.max(0, p.value), low: Math.min(0, p.value), color: barColor(p),
  });
  let frozen = null, lastRange = null;
  const provider = orig => {        // 봉 모드: 위쪽에 여유를 둬서 더 길게 끌 수 있게, 끄는 동안엔 눈금 고정
    if (frozen) return { priceRange: frozen };
    const r = orig();
    let lo = 0, hi = 100;
    if (r && r.priceRange) { lo = Math.min(0, r.priceRange.minValue); hi = r.priceRange.maxValue; }
    if (hi <= lo) hi = lo + 100;
    const room = candle ? 1.3 : 1;
    lastRange = { minValue: lo < 0 ? lo * room : 0, maxValue: candle && ymax ? ymax : hi * room };
    return { priceRange: lastRange };
  };

  if (S.chartStyle === 'column' || candle) {
    mainSeries = chart.addCandlestickSeries({
      priceScaleId: 'left', priceFormat: pf(axis), autoscaleInfoProvider: provider,
      upColor: cssVar('--bar'), downColor: cssVar('--bar'), wickVisible: false, borderVisible: false,
    });
    mainSeries.setData(colored());
  } else if (S.chartStyle === 'area') {
    mainSeries = chart.addAreaSeries({ priceScaleId: 'left', priceFormat: pf(axis), lineColor: cssVar('--bar'), lineWidth: 2,
                                       topColor: 'rgba(19,162,107,.28)', bottomColor: 'rgba(19,162,107,0)' });
    mainSeries.setData(full);
  } else {
    mainSeries = chart.addLineSeries({ priceScaleId: 'left', priceFormat: pf(axis), color: cssVar('--bar'), lineWidth: 2 });
    mainSeries.setData(full);
  }
  // 원본 값을 고친 날짜에 점 찍기 (일 단위, 봉 모드가 아닐 때)
  if (S.window === 'DAY' && !candle) {
    const orig = (def.needs || [def.key]).map(k => (raw[c.id] && raw[c.id][k]) || new Map());
    mainSeries.setMarkers(editedDays(c.id, def).filter(d => orig.some(m => m.has(d)))
      .map(time => ({ time, position: 'aboveBar', color: cssVar('--brand'), shape: 'circle', size: 0.6 })));
  }

  // 3) 이동평균선
  const legend = [];
  const maLine = (arr, color, label) => {
    chart.addLineSeries({ priceScaleId: 'left', priceFormat: pf(axis), color, lineWidth: 1.5,
                          priceLineVisible: false, lastValueVisible: false }).setData(arr);
    legend.push(`<span><i class="lg-line" style="background:${color}"></i>${label}</span>`);
  };
  if (S.sma !== '0' && full.length) maLine(sma(full, +S.sma), cssVar('--sma'), 'SMA ' + S.sma);
  if (S.ema !== '0' && full.length) maLine(ema(full, +S.ema), cssVar('--ema'), 'EMA ' + S.ema);

  // 4) 가격 (오른쪽 눈금, 검정 선) — '봉' 스타일에서는 숨겨요
  const withPrice = !candle && def.key !== 'PriceUSD';
  if (withPrice) {
    const first = full.length ? full[0].time : '';
    const price = aggregate(toArr(baseMap(c.id, 'PriceUSD')), S.window).filter(p => !first || p.time >= first);
    chart.addLineSeries({ priceScaleId: 'right', color: cssVar('--priceline'), lineWidth: 1.2,
                          priceFormat: pf(v => fmt(v, { fmt: 'usd' }, c)) }).setData(price);
  }
  const mode = S.scale === 'log' ? 1 : 0;
  chart.applyOptions({ leftPriceScale: { mode }, rightPriceScale: { visible: withPrice, mode } });

  // 5) 처음 보여줄 기간
  const from = rangeStart(n ? chartData[n - 1].time : '', S.range);
  if (!from) chart.timeScale().fitContent();
  else {
    const i = Math.max(0, chartData.findIndex(p => p.time >= from));
    chart.timeScale().setVisibleLogicalRange({ from: i - 0.5, to: n - 0.5 + 1 });
  }

  $('legend').innerHTML = [
    withPrice ? `<span><i class="lg-line" style="background:var(--priceline)"></i>가격(USD)</span>` : '',
    `<span><i class="lg-dot" style="background:var(--bar)"></i>${def.name}</span>`,
    ...legend,
  ].join('');

  // 6) 안내 문구
  const hint = $('dragHint');
  if (candle) {
    hint.hidden = true;   // 안내 문구는 화면에 보이지 않게
    hint.innerHTML = def.calc
      ? `이 지표는 자동 계산이라 끌어서 고칠 수 없어요. 재료 지표(${def.needs.map(k => metricByKey(k).name).join(', ')})에서 고쳐 주세요.`
      : S.window !== 'DAY'
      ? '막대 길이는 <b>단위: 1일</b>일 때만 끌어서 고칠 수 있어요.'
      : '↕ 막대를 마우스로 <b>위아래로 끌면</b> 길이(값)가 바뀌고, 놓는 순간 저장돼요. 빈 칸을 눌러 끌면 새 막대가 생겨요. 옆으로 이동은 아래 미니 차트에서 해요.';
  }
  $('chartbox').classList.toggle('dragmode', canDrag);
  $('chartMsg').innerHTML = hasValue ? '' : canDrag
    ? '아직 값이 없어요.<br>아무 칸이나 눌러 위로 끌어 올려 보세요.'
    : def.calc
    ? `아직 데이터가 없어요.<br>이 지표는 ${def.needs.map(k => metricByKey(k).name).join(', ')}로 계산돼요. 그 지표에 값을 입력해 보세요.`
    : `아직 데이터가 없어요.<br>차트 스타일을 <b>봉</b>으로 바꾸면 마우스로 막대를 직접 그릴 수 있어요.`;

  // 7) 막대 끌어서 값 바꾸기
  if (canDrag) {
    const box = $('chart');
    let drag = null;
    const locate = e => {
      const r = box.getBoundingClientRect();
      const paneLeft = r.width - chart.priceScale('right').width() - chart.timeScale().width();   // 왼쪽 눈금 너비만큼 빼기
      return { x: e.clientX - r.left - paneLeft, y: e.clientY - r.top,
               w: chart.timeScale().width(), h: r.height - chart.timeScale().height() };
    };
    const move = e => {
      let v = mainSeries.coordinateToPrice(Math.max(0, Math.min(locate(e).y, locate(e).h)));
      if (v == null || !isFinite(v)) return;
      if (def.kind !== 'hist') v = Math.max(0, v);
      v = Number(v.toPrecision(6));
      const p = chartData[drag];
      p.value = v;
      p.ph = false;
      mainSeries.setData(colored());
      hint.innerHTML = `<b>${p.time}</b> → <b>${fmt(v, def, c)}</b> &nbsp;(놓으면 저장돼요)`;
    };
    const end = () => {
      if (drag == null) return;
      const p = chartData[drag];
      drag = null; frozen = null;
      if (p.ph || p.value == null) return;
      setValue(c.id, def.key, p.time, p.value);
      mainSeries.setData(colored());          // 눈금 다시 맞추기
      $('chartMsg').innerHTML = '';
      hint.innerHTML = `✓ <b>${p.time}</b> 값을 <b>${fmt(p.value, def, c)}</b>(으)로 저장했어요. 되돌리려면 오른쪽 위 <b>✎ 데이터 편집</b>을 켜고 아래 표에서 지우세요.`;
      drawEditArea(c, def);
      drawSide();
      drawNavigator();
    };
    box.addEventListener('pointerdown', e => {
      const p = locate(e);
      if (p.x < 0 || p.x > p.w || p.y < 0 || p.y > p.h) return;
      const idx = Math.round(chart.timeScale().coordinateToLogical(p.x));
      if (!(idx >= 0 && idx < n)) return;
      frozen = lastRange;
      drag = idx;
      try { box.setPointerCapture(e.pointerId); } catch {}
      e.preventDefault();
      move(e);
    }, true);
    box.addEventListener('pointermove', e => { if (drag != null) move(e); }, true);
    box.addEventListener('pointerup', end, true);
    box.addEventListener('pointercancel', end, true);
  }

  drawNavigator();
}

/* ----- 아래 미니 차트 (전체 기간 + 보이는 구간 조절) ----- */
function drawNavigator() {
  const nav = $('navi');
  if (!nav || !chart) return;
  const n = chartData.length;
  if (n < 2) { nav.style.display = 'none'; return; }
  nav.style.display = '';
  const svg = $('naviSvg'), win = $('navWin');
  const W = nav.clientWidth, H = nav.clientHeight;
  const X = i => i / (n - 1) * W;

  const draw = () => {
    const real = p => p.value != null && !p.ph;
    const vals = chartData.filter(real).map(p => p.value);
    const lo = vals.length ? Math.min(0, ...vals) : 0, hi = vals.length ? Math.max(...vals) : 1;
    const Y = v => H - 16 - (v - lo) / ((hi - lo) || 1) * (H - 26);
    const pts = chartData.map((p, i) => real(p) ? `${X(i).toFixed(1)},${Y(p.value).toFixed(1)}` : '').filter(Boolean).join(' ');
    // 날짜 표시: 글자가 겹치지 않게 1·3·6·12·24·60개월 중 알맞은 간격으로
    const mIdx = t => +t.slice(0, 4) * 12 + +t.slice(5, 7) - 1;
    const months = mIdx(chartData[n - 1].time) - mIdx(chartData[0].time) + 1;
    const step = [1, 3, 6, 12, 24, 36, 60, 120].find(s => months / s <= W / 75) || 120;
    let labels = '', prev = '';
    chartData.forEach((p, i) => {
      const ym = p.time.slice(0, 7);
      if (prev && ym !== prev) {
        if (mIdx(p.time) % step === 0) {
          labels += `<line x1="${X(i)}" x2="${X(i)}" y1="0" y2="${H}" stroke="#ececf0"/>
                     <text x="${X(i) + 4}" y="${H - 4}" font-size="10" fill="#9a9aa6">${ym.replace('-', ' ')}</text>`;
        }
      }
      prev = ym;
    });
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = labels + (pts ? `<polyline points="${pts}" fill="none" stroke="${cssVar('--bar')}" stroke-width="1.2"/>` : '');
  };
  draw();

  // 차트에서 보이는 구간 ↔ 미니 차트의 네모 칸 맞추기
  if (navSync) chart.timeScale().unsubscribeVisibleLogicalRangeChange(navSync);
  navSync = r => {
    if (!r) return;
    const a = Math.max(0, r.from), b = Math.min(n - 1, r.to);
    win.style.left = X(a) + 'px';
    win.style.width = Math.max(8, X(b) - X(a)) + 'px';
  };
  chart.timeScale().subscribeVisibleLogicalRangeChange(navSync);
  navSync(chart.timeScale().getVisibleLogicalRange());

  // 네모 칸 끌기: 가운데=이동, 양쪽 손잡이=넓히기/좁히기, 바깥 클릭=그 위치로 이동
  nav.onpointerdown = e => {
    const rect = nav.getBoundingClientRect();
    const perPx = (n - 1) / W;
    const start = chart.timeScale().getVisibleLogicalRange();
    if (!start) return;
    let mode = e.target.dataset.h || (e.target === win ? 'move' : 'jump');
    let base = { from: start.from, to: start.to }, x0 = e.clientX;
    if (mode === 'jump') {
      const span = base.to - base.from, mid = (e.clientX - rect.left) * perPx;
      base = { from: mid - span / 2, to: mid + span / 2 };
      chart.timeScale().setVisibleLogicalRange(base);
      mode = 'move';
    }
    try { nav.setPointerCapture(e.pointerId); } catch {}
    nav.onpointermove = ev => {
      const di = (ev.clientX - x0) * perPx;
      let { from, to } = base;
      if (mode === 'move') { from += di; to += di; }
      else if (mode === 'l') from = Math.min(from + di, to - 3);
      else to = Math.max(to + di, from + 3);
      chart.timeScale().setVisibleLogicalRange({ from, to });
    };
    nav.onpointerup = nav.onpointercancel = () => { nav.onpointermove = null; };
  };

  if (navObserver) navObserver.disconnect();
  navObserver = new ResizeObserver(() => { if (nav.clientWidth !== W) drawNavigator(); });
  navObserver.observe(nav);
}

/* ----- 편집 영역 ----- */
// "2026-10-01, 87461300000000" 같은 줄들을 [날짜, 값] 목록으로 바꾸기
function parseBulk(text) {
  const out = [], bad = [];
  for (const line of text.split(/\r?\n/)) {
    const s = line.trim();
    if (!s) continue;
    const m = s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})\S*[\s,;\t]+"?(-?[\d,.]+(?:e[+-]?\d+)?)"?/i);
    if (!m) { bad.push(s); continue; }
    const day = `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
    const v = parseFloat(m[4].replace(/,/g, ''));
    if (isFinite(v)) out.push([day, v]); else bad.push(s);
  }
  return { out, bad };
}

function drawEditArea(c, def) {
  const box = $('editArea');
  let html = `<h4>✎ 이 지표 수정하기 · ${c.name}</h4>`;
  if (def.calc) {
    html += `<p class="hint">이 지표는 자동으로 계산돼요. 아래 재료 지표를 고치면 함께 바뀌어요:
      ${def.needs.map(k => { const m = metricByKey(k); return `<a href="${link(c, m.cat, m.key)}">${m.name}</a>`; }).join(', ')}</p>`;
  } else {
    const orig = (raw[c.id] && raw[c.id][def.key]) || new Map();
    const merged = toArr(baseMap(c.id, def.key));
    const lastDay = merged.length ? merged[merged.length - 1].time : new Date().toISOString().slice(0, 10);
    const mine = editsOf(c.id, def.key);
    const rows = [...new Set([...merged.slice(-30).map(p => p.time), ...Object.keys(mine)])].sort().reverse();
    html += `
      <p class="hint">숫자는 원본 단위(${rawUnit(def, c)})로 넣어 주세요. 칸을 비우면 원래 값으로 돌아가요. 새 날짜를 넣으면 데이터가 추가돼요.</p>
      <div class="addrow">
        <input type="date" id="addDay" value="${lastDay}">
        <input type="number" step="any" id="addVal" placeholder="값 (${rawUnit(def, c)})">
        <button class="btn primary" id="addBtn">이 날짜에 저장</button>
      </div>

      <h5>여러 날짜 한 번에 붙여넣기</h5>
      <p class="hint">엑셀이나 CSV 파일에서 <b>날짜</b>와 <b>값</b> 두 칸을 복사해서 붙여넣으세요. 한 줄에 하루씩이에요.<br>
        예) <code>2026-10-01, 87461300000000</code> &nbsp;또는 엑셀에서 복사한 그대로 (탭으로 구분)</p>
      <textarea id="bulk" placeholder="2026-10-01, 87461300000000&#10;2026-10-02, 87470000000000&#10;2026-10-03, 87455000000000"></textarea>
      <div class="addrow" style="margin-top:8px">
        <button class="btn primary" id="bulkBtn">붙여넣은 값 저장</button>
        <button class="btn" id="csvBtn">CSV 파일에서 읽기</button>
        <input type="file" id="csvFile" accept=".csv,.txt,text/csv,text/plain" hidden>
        <span class="hint" id="bulkMsg" style="margin:0;align-self:center"></span>
      </div>

      ${rows.length ? `<h5>최근 값 하나씩 고치기</h5>
      <div class="tablewrap"><table class="etbl">
        <thead><tr><th>날짜</th><th>원본 값</th><th>내가 고친 값</th><th></th></tr></thead>
        <tbody>${rows.map(d => `
          <tr class="${d in mine ? 'changed' : ''}">
            <td>${d}</td>
            <td>${orig.has(d) ? fmt(orig.get(d), def, c) : '<span class="nodata">없음</span>'}</td>
            <td><input type="number" step="any" data-day="${d}" value="${d in mine ? mine[d] : ''}" placeholder="${orig.has(d) ? orig.get(d) : ''}"></td>
            <td>${d in mine ? `<button class="btn" data-undo="${d}">되돌리기</button>` : ''}</td>
          </tr>`).join('')}
        </tbody></table></div>
      ${Object.keys(mine).length ? `<div class="addrow" style="margin-top:10px"><button class="btn" id="clearAll">이 지표에서 고친 값 모두 지우기</button></div>` : ''}` : ''}`;
  }
  html += `<h5>표에 보일 메모</h5>
    <textarea id="memo" placeholder="예: 10월 둘째 주 대규모 출금 — 기관 매수 추정"></textarea>`;
  box.innerHTML = html;
  $('memo').value = noteOf(c.id, def.key);
  $('memo').onchange = () => setNote(c.id, def.key, $('memo').value);
  if (def.calc) return;

  $('addBtn').onclick = () => {
    const d = $('addDay').value, v = $('addVal').value;
    if (!d || v === '') return alert('날짜와 값을 모두 넣어 주세요.');
    setValue(c.id, def.key, d, parseFloat(v)); rerender();
  };
  const saveBulk = text => {
    const { out, bad } = parseBulk(text);
    if (!out.length) { $('bulkMsg').textContent = '읽을 수 있는 줄이 없어요. "날짜, 값" 형식인지 확인해 주세요.'; return; }
    setValues(c.id, def.key, out);
    rerender();
    $('bulkMsg').textContent = `${out.length}개 저장했어요` + (bad.length ? ` · 못 읽은 줄 ${bad.length}개 (예: ${bad[0].slice(0, 40)})` : '');
  };
  $('bulkBtn').onclick = () => saveBulk($('bulk').value);
  $('csvBtn').onclick = () => $('csvFile').click();
  $('csvFile').onchange = async () => { const f = $('csvFile').files[0]; if (f) saveBulk(await f.text()); };
  box.querySelectorAll('input[data-day]').forEach(inp => inp.onchange = () => {
    setValue(c.id, def.key, inp.dataset.day, inp.value === '' ? '' : parseFloat(inp.value)); rerender();
  });
  box.querySelectorAll('[data-undo]').forEach(b => b.onclick = () => { setValue(c.id, def.key, b.dataset.undo, ''); rerender(); });
  if ($('clearAll')) $('clearAll').onclick = () => {
    if (!confirm(`${c.name} · ${def.name}에서 고친 값을 모두 지울까요?`)) return;
    setValues(c.id, def.key, Object.keys(editsOf(c.id, def.key)).map(d => [d, ''])); rerender();
  };
}

/* =====================================================================
   11) 버튼 연결
   ===================================================================== */
$('editToggle').onclick = () => {
  const on = document.body.classList.toggle('editing');
  $('editToggle').textContent = on ? '✓ 편집 끝내기' : '✎ 데이터 편집';
};
$('search').oninput = drawSide;
$('sideClose').onclick = () => {
  if (matchMedia('(max-width: 960px)').matches) document.body.classList.remove('side-open');
  else document.body.classList.add('side-closed');
};
$('sideOpen').onclick = () => {
  if (matchMedia('(max-width: 960px)').matches) document.body.classList.add('side-open');
  else document.body.classList.remove('side-closed');
};
$('sideShade').onclick = () => document.body.classList.remove('side-open');

$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(OV, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'overrides.json';
  a.click();
  URL.revokeObjectURL(a.href);
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async () => {
  const f = $('importFile').files[0];
  if (!f) return;
  try { OV = tidy(JSON.parse(await f.text())); saveLocal(); rerender(); }
  catch { alert('파일을 읽지 못했어요. overrides.json 파일이 맞는지 확인해 주세요.'); }
  $('importFile').value = '';
};
$('resetBtn').onclick = () => {
  if (!confirm('이 브라우저에서 고친 내용을 모두 지우고, GitHub에 올라가 있는 버전으로 되돌릴까요?')) return;
  try { localStorage.removeItem(LS_KEY); } catch {}
  OV = JSON.parse(JSON.stringify(PUBLISHED));
  updateEditCount();
  rerender();
};

window.addEventListener('hashchange', render);

// 시작! (저장된 수정본과 시세를 먼저 불러오고 화면 그리기)
drawTabs();
Promise.all([loadOverrides(), loadMarket()]).then(() => { updateEditCount(); render(); });
</script>
</body>
</html>
